<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>Comunica</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --sky-top: #bfe1ff;
  --sky-bottom: #edf8ff;
  --sky-glow: #dff3ff;
  --yellow: #f7c94d;
  --yellow-dark: #d9a314;
  --navy: #103d5d;
  --navy-soft: #ffffff;
  --card: #0d3556;
  --card-border: rgba(18, 60, 90, 0.16);
  --green: #1c5873;
  --red: #1c5873;
  --white: #ffffff;
  --radius: 18px;
  --font: 'Manrope', sans-serif;
  --font-title: 'Manrope', sans-serif;
}

body[data-theme="dark"] {
  --sky-top: #0b1f31;
  --sky-bottom: #102f48;
  --sky-glow: #173a56;
  --navy: #eff7ff;
  --navy-soft: #d4e6f5;
  --card: #17344d;
  --card-border: #3f6685;
  --white: #eff7ff;
  background: #0b1f31 !important;
  color: #eff7ff !important;
}

body[data-theme="dark"] #app,
body[data-theme="dark"] .app {
  color: #eff7ff;
}

body[data-theme="dark"] .splash-screen {
  background: #0b1f31 !important;
  color: #eff7ff;
}

body[data-theme="dark"] .form-block,
body[data-theme="dark"] .info-block,
body[data-theme="dark"] .word-card,
body[data-theme="dark"] .cat-card,
body[data-theme="dark"] .category-card,
body[data-theme="dark"] .fav-item,
body[data-theme="dark"] .challenge-card,
body[data-theme="dark"] .profile-choice-card,
body[data-theme="dark"] .menu-btn {
  background: #17344d !important;
  color: #eff7ff !important;
  border-color: #3f6685 !important;
}

body[data-theme="dark"] input,
body[data-theme="dark"] select,
body[data-theme="dark"] textarea,
body[data-theme="dark"] .phrase-bar {
  background: #0f293e !important;
  color: #eff7ff !important;
  border-color: #4f7898 !important;
}

body[data-theme="dark"] .word-card .label,
body[data-theme="dark"] .word-card .description,
body[data-theme="dark"] .cat-card .label,
body[data-theme="dark"] .cat-card .count,
body[data-theme="dark"] .menu-title,
body[data-theme="dark"] .menu-sub,
body[data-theme="dark"] label,
body[data-theme="dark"] p {
  color: #eff7ff !important;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: calc(100% * var(--a11y-scale, 1));
}

button,
[role="button"],
[data-go],
[data-word],
[data-category],
.menu-btn,
.word-card,
.cat-card,
.about-link,
.back-link {
  touch-action: manipulation;
}

html,
body {
   width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-glow) 26%, var(--sky-bottom) 100%);
    color: var(--navy);
}
#app {
    width: 100%;
    max-width: none;
    min-height: 100vh;
    border: none;
    outline: none;
    box-shadow: none;
    background: transparent;
}

body,.bg-outras{
    font-family: var(--font);
    background-image: none !important;
    background-size: auto;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}



#app,
.app {
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: clamp(12px, 3vw, 32px);
}
.topbar{
  display: flex;
  gap: 0.5rem;
}

.topbar,
.app-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 14px;
}

.topbar-title {
  font-family: var(--font-title);
  font-size: 18px;
  font-weight: 800;
  color: var(--white);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  text-align: center;
}

.icon-btn,
.profile-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  color: var(--navy);
  box-shadow: 0 4px 8px rgba(23, 58, 94, 0.15);
  backdrop-filter: blur(5px);
  transition: transform 0.15s ease, background 0.15s ease;
}

.icon-btn:hover,
.profile-btn:hover {
  transform: scale(1.05);
}

.icon-btn:active,
.profile-btn:active {
  transform: scale(0.94);
}


.home-hero {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 8px;
  margin-bottom: 12px;
}


.hero-cover-img {
  width: 100%;
  max-width: 430px;
  height: auto;
  display: block;
  border-radius: 18px;
  object-fit: contain;
}

.menu {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.home-screen {
  
  display: grid;
  justify-content: center;
  text-align: left;
  gap:2rem
}

.brand-intro {
  margin: 12px 0 26px;
  padding: 10px 4px;
}

.brand-intro h1 {
  margin: 0;
  color: var(--navy);
  font-family: var(--font-title);
  font-size: clamp(34px, 8vw, 52px);
  font-weight: 900;
  letter-spacing: -0.055em;
  text-shadow: 0 8px 24px rgba(16, 61, 93, 0.12);
}

.brand-intro p {
  margin: 10px 0 0;
  color: rgba(16, 61, 93, 0.8);
  font-size: 15px;
  font-weight: 700;
}

.menu-btn.primary,
.card.yellow,
.action-btn.primary {
  background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(190,225,255,0.8));
  border-color: rgba(16, 61, 93, 0.12);
}

.menu-btn,
.card,
.word-card,
.phrase-card,
.profile-card,
.history-card {
  box-shadow: 0 4px 14px rgba(28, 88, 115, 0.09);
  
}

.topbar-title {
  color: var(--white);
  text-shadow: none;
}


.menu-btn,
.card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;

  border: 1px solid rgba(17, 62, 96, 0.08);
  border-radius: 22px;
  padding: 14px 16px;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  text-align: left;
  text-decoration: none;
  color: var(--navy);
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 25px rgba(16, 61, 93, 0.08);
  font-family: var(--font);
}

.menu-btn:hover,
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 30px rgba(16, 61, 93, 0.12);
}

.menu-btn:active,
.card:active {
  transform: scale(0.98);
}

.menu-btn.primary {
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(195,229,255,0.82));
  border-color: rgba(16, 61, 93, 0.12);
}



.menu-emoji,
.card-icon {
  width: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  text-align: center;
}

.line-menu-icon {
  position: relative;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
}

.line-menu-icon::before,
.line-menu-icon::after {
  position: absolute;
  box-sizing: border-box;
  content: '';
}

.icon-message::before { inset: 4px 3px 7px; border: 2px solid var(--white); border-radius: 7px; }
.icon-message::after { bottom: 4px; left: 8px; width: 7px; height: 7px; border-bottom: 2px solid var(--white); border-left: 2px solid var(--white); transform: rotate(-45deg); }
.icon-favorite::before { inset: 0; color: var(--white); font-size: 31px; line-height: 28px; text-align: center; content: '☆'; }
.icon-library::before { top: 3px; left: 5px; width: 20px; height: 24px; border: 2px solid var(--white); border-radius: 3px; }
.icon-library::after { top: 9px; left: 10px; width: 10px; height: 2px; background: var(--white); box-shadow: 0 5px 0 var(--white), 0 10px 0 var(--white); }
.icon-settings::before { top: 7px; left: 7px; width: 16px; height: 16px; border: 2px solid var(--white); border-radius: 50%; box-shadow: 0 -6px 0 -4px var(--white), 0 6px 0 -4px var(--white), 6px 0 0 -4px var(--white), -6px 0 0 -4px var(--white); }
.icon-challenge::before { inset: 3px; border: 2px solid var(--white); border-radius: 50%; }
.icon-challenge::after { top: 12px; left: 12px; width: 6px; height: 6px; background: var(--white); border-radius: 50%; }

.profile-outline { position: relative; display: block; width: 20px; height: 20px; border: 2px solid var(--white); border-radius: 50%; }
.profile-outline::before, .profile-outline::after { position: absolute; left: 50%; box-sizing: border-box; content: ''; transform: translateX(-50%); }
.profile-outline::before { top: 3px; width: 6px; height: 6px; border: 1.5px solid var(--white); border-radius: 50%; }
.profile-outline::after { bottom: 2px; width: 11px; height: 6px; border: 1.5px solid var(--white); border-radius: 7px 7px 3px 3px; }

.app-line-icon {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: var(--white);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.menu-text,
.card-text {
  flex: 1;
}

.menu-title,
.card-text h3 {
  font-family: var(--font-title);
  font-size: 14px;
  line-height: 1.1;
  color: var(--white);
  font-weight: 800;
  margin: 0 0 2px;
}

.menu-sub,
.card-text p {
  font-size: 11px;
  line-height: 1.2;
  color: var(--navy-soft);
  font-weight: 600;
  margin: 0;
}

.menu-arrow,
.chevron {
  font-size: 20px;
  color: var(--navy-soft);
  margin-left: 6px;
}

.about-link {
  text-align: center;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 800;
  color: #ffffff;
  cursor: pointer;
  text-decoration: none;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}

.about-link:hover {
  text-decoration: underline;
}



.screen {
  width: 100%;
  padding: 4px 0 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.section-label {
  font-family: var(--font-title);
  font-size: 14px;
  font-weight: 800;
  color: var(--white);
  margin: 4px 0 10px;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
}

.favorites-screen {
  overflow-x: visible;
}

.favorites-heading {
  margin-top: 8px;
  margin-bottom: 12px;
}

.favorites-heading-words {
  margin-top: 24px;
}



.phrase-bar {
  width: 100%;
  background: #ffffff;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  min-height: 60px;
  height: auto;
  padding: 8px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  align-content: center;
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 16px;
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.08);
}

.phrase-chip {
 
 
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  line-height: 1;
  font-weight: 800;
  white-space: nowrap;

}
.phrase-chip span{
  color: #092B3B;
}

.phrase-placeholder {
  color: #123b4d6c;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.3;
}


.layer-label {
  text-align: center;
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 13px;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

.carousel-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 18px;
  min-height: 190px;
}

.input-mode-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: min(100%, 720px);
  margin: 18px auto 20px;
}

.input-mode-tab {
  min-height: 76px;
  border: 3px solid rgba(255, 255, 255, 0.8);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.78);
  color: var(--navy);
  font: 800 clamp(17px, 3vw, 24px) var(--font);
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
}

.input-mode-tab:hover { transform: translateY(-1px); }
.input-mode-tab:active { transform: scale(0.98); }
.input-mode-tab.active {
  background: var(--yellow);
  border-color: var(--yellow-dark);
  box-shadow: 0 8px 18px rgba(23, 58, 94, 0.22);
}

.input-mode-placeholder {
  min-height: 190px;
  width: 100%;
  margin-bottom: 18px;
  border: 2px dashed rgba(255, 255, 255, 0.75);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.22);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  color: #ffffff;
}

.input-mode-placeholder-icon { font-size: 56px; line-height: 1; opacity: 0.9; }
.input-mode-placeholder strong { font-size: 17px; }
.input-mode-placeholder span { font-size: 12px; font-weight: 700; opacity: 0.9; }

.mode-choice-hint {
  margin: 0 auto 18px;
  text-align: center;
  color: rgba(255, 255, 255, 0.9);
  font-size: 13px;
  font-weight: 700;
}

.mode-choice-screen { min-height: 100vh; width: 100%; padding: 24px; display: flex; flex-direction: column; }
.mode-choice-back { align-self: flex-start; border: 0; border-radius: 999px; padding: 14px 20px; background: rgba(255,255,255,.94); color: var(--navy); font: 800 16px var(--font); cursor: pointer; }
.mode-choice-content { width: min(100%, 760px); margin: auto; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.mode-choice-content h1 { margin: 0 0 10px; color: #fff; font-size: clamp(28px,5vw,48px); text-shadow: 0 2px 5px rgba(23,58,94,.4); }
.mode-choice-button { width: min(100%, 680px); min-height: 120px; border: 4px solid rgba(255,255,255,.9); border-radius: 28px; background: #fff; color: var(--navy); font: 900 clamp(24px,5vw,42px) var(--font); box-shadow: 0 10px 24px rgba(23,58,94,.2); cursor: pointer; transition: transform .15s ease, background .15s ease; }
.mode-choice-button:hover { transform: scale(1.02); background: #fff4c9; }
.mode-choice-button:active { transform: scale(.98); }

.mode-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  min-height: 100vh;
  width: 100%;
  padding: 24px;
  background: #1b364a;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  overflow: auto;
}

.mode-screen-back {
  align-self: flex-start;
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--navy);
  font: 800 15px var(--font);
  cursor: pointer;
}

.mode-screen-content {
  margin: auto;
  width: min(100%, 760px);
  min-height: 360px;
  border: 2px solid rgba(255, 255, 255, 0.22);
  border-radius: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  background: #234b61;
}

.mode-screen-content .input-mode-placeholder-icon { font-size: 86px; }
.mode-screen-content h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); }
.mode-screen-content p { margin: 0; font-size: 16px; font-weight: 700; opacity: 0.9; }

.circular-keyboard-reserved {
  width: min(100%, 620px);
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 22px 18px 26px;
  border-radius: 28px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02));
  box-shadow: 0 20px 44px rgba(9, 43, 59, 0.35);
  backdrop-filter: blur(8px);
  color: var(--white);
}

.circular-keyboard-reserved .campo {
  width: 100%;
  min-height: 56px;
  background: #ffffff;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  font-family: var(--font);
  font-weight: 800;
  font-size: 18px;
  color: #103d5d;
  text-shadow: 0 1px 1px rgba(255,255,255,0.45);
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.18);
}

.circular-keyboard-reserved .frases-prontas {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  min-height: 0;
}

.circular-keyboard-reserved .frase-pronta {
  border: 1.5px solid var(--card-border);
  border-radius: 999px;
  padding: 8px 16px;
  background: #ffffff;
  color: var(--navy);
  font: 700 13px var(--font);
  cursor: pointer;
  transition: background .15s ease, color .15s ease, transform .1s ease;
}

.circular-keyboard-reserved .frase-pronta:hover,
.circular-keyboard-reserved .frase-pronta:focus-visible {
  background: var(--yellow);
  border-color: var(--yellow-dark);
  color: var(--navy);
  outline: none;
}

.teclado-area {
  position: relative;
  width: min(530px, 100%);
  height: auto;
  max-width: 100%;
  aspect-ratio: 1 / 1;
  margin: 12px 0 10px;
}

.teclado-area .teclado,
.teclado-area .anel,
.teclado-area .satelites {
  position: absolute;
  inset: 0;
}

.teclado-area .anel {
  margin: auto;
  border-radius: 50%;
  transition: opacity .25s ease, transform .25s ease, background .2s ease;
}

/* Argola de sugestões (autocomplete): fica por fora e só aparece depois da
   primeira palavra-chave escolhida, crescendo ao redor da argola interna. */
.anel-externo {
  width: 85%;
  height: 85%;
  background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(238,246,252,0.68));
  border: 2px solid var(--card-border);
  box-shadow: 0 10px 26px rgba(9, 43, 59, 0.28);
  opacity: 0;
  transform: scale(0.85);
  pointer-events: none;
}

.anel-externo.visivel {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

/* Argola de palavras-chave: fica por dentro e sempre visível. */
.anel-meio {
  width: 60%;
  height: 60%;
  background: var(--card);
  border: 2px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 12px 30px rgba(9, 43, 59, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
}

.cunha {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s ease;
}

.cunha.ativa {
  opacity: 1;
}

/* Botão "Aa" no centro da argola inicial: alterna a argola de fora entre
   sugestões de palavras e um teclado alfabético. */
.buraco-central {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 28%;
  height: 28%;
  border: 0;
  border-radius: 50%;
  background: #ffffff;
  color: var(--navy);
  font: 800 15px var(--font);
  cursor: pointer;
  transform: translate(-50%, -50%);
  box-shadow: 0 4px 10px rgba(9, 43, 59, 0.28);
  transition: background .15s ease, color .15s ease;
}

.buraco-central.ativo {
  background: var(--yellow);
  color: var(--navy);
  box-shadow: 0 4px 12px rgba(174, 129, 0, 0.35);
}

.buraco-central:focus,
.buraco-central:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 2px;
}

.tecla {
  position: absolute;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  padding: 3px;
  border: 0;
  border-radius: 50%;
  outline: none;
  background: transparent;
  color: var(--white);
  font: 700 11px/1.05 var(--font);
  text-align: center;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: color .12s ease;
}

.anel-externo .tecla { font-size: 12px; color: #103d5d; text-shadow: 0 1px 2px rgba(255,255,255,0.9); }
.anel-meio .tecla { font-size: 10px; color: #ffffff; }

/* Teclas menores para caber as 26 letras do modo alfabético na argola de dentro. */
.tecla-compacta {
  width: 32px;
  height: 32px;
  padding: 2px;
}
.anel-meio .tecla-compacta { font-size: 13px; }

/* Indicação visual de foco, essencial para navegar com as setas do teclado físico.
   O destaque principal é o setor (cunha) atrás da tecla; aqui só garantimos contraste do texto. */
.tecla:focus,
.tecla:focus-visible {
  outline: none;
  color: var(--navy);
}

.satelites {
  z-index: 2;
  pointer-events: none;
}

.satelite {
  position: absolute;
  width: 54px;
  height: 54px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);
  color: var(--navy);
  font: 800 10px var(--font);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 4px 10px rgba(9, 43, 59, 0.28);
  /* left/top são calculados em JS (posicionarMenuOrbital), com a mesma
     trigonometria usada nas teclas, para encaixar exatamente na
     circunferência da argola visível no momento. */
  transform: translate(-50%, -50%);
  transition: left .2s ease, top .2s ease, opacity .16s ease, background .2s ease, color .2s ease;
}

.satelites.ativo .satelite {
  opacity: 1;
  pointer-events: auto;
}

.satelite:hover,
.satelite:focus-visible {
  background: var(--yellow);
  color: var(--navy);
  outline: 3px solid var(--yellow-dark);
  outline-offset: 2px;
}

.satelite-destaque {
  background: var(--yellow);
  color: var(--navy);
  border: 1px solid var(--yellow-dark);
}

/* ===== Ajustes do teclado circular e menu orbital ===== */
/*
   No teclado circular o foco do navegador e o hover NÃO devem criar uma
   segunda seleção visual. A única indicação de seleção da tecla é a cunha
   amarela clara desenhada atrás dela por mostrarCunha().
*/
.teclado-area .tecla:hover,
.teclado-area .tecla:focus,
.teclado-area .tecla:focus-visible,
.teclado-area .tecla.accessibility-focus,
.teclado-area .tecla.scan-active {
  outline: none !important;
  outline-offset: 0 !important;
  box-shadow: none !important;
  border: 0 !important;
  background: transparent !important;
  transform: translate(-50%, -50%) !important;
}

/* Evita que regras gerais de acessibilidade desenhem um círculo extra
   sobre as teclas do teclado circular. */
#app .teclado-area .tecla:hover,
#app .teclado-area .tecla:focus-visible,
#app .teclado-area .tecla.accessibility-focus,
#app .teclado-area .tecla.scan-active {
  outline: none !important;
  box-shadow: none !important;
  background: transparent !important;
}

/* O botão central Aa precisa permanecer legível em qualquer estado. */
.teclado-area .buraco-central,
.teclado-area .buraco-central:hover,
.teclado-area .buraco-central:focus,
.teclado-area .buraco-central:focus-visible,
.teclado-area .buraco-central.accessibility-focus {
  color: #103d5d !important;
  text-shadow: none !important;
}

.teclado-area .buraco-central.ativo {
  color: #103d5d !important;
}


/* O menu fica levemente translúcido, mas mantém contraste suficiente antes do foco. */

/* ===== Onboarding (login + escolha de perfil) ===== */

.onboard-wrap {
  width: 100%;
  display: flex;
  flex-direction: column;
  padding-top: 30px;
}

.onboard-title {
  font-family: var(--font-title);
  font-size: 30px;
  font-weight: 800;
  color: #ffffff;
  text-align: center;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  margin-bottom: 6px;
}

.onboard-subtitle {
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.85);
  margin-bottom: 22px;
}

.onboard-panel {
  width: 100%;
  background: rgba(255, 255, 255, 0.04);
  border: 1.5px solid var(--card-border);
  border-radius: 22px;
  padding: 20px 16px;
  backdrop-filter: blur(4px);
}

.onboard-panel h2 {
  text-align: center;
  font-family: var(--font-title);
  font-size: 19px;
  font-weight: 800;
  color: #ffffff;
  margin: 0 0 6px;
}

.onboard-panel > p {
  text-align: center;
  font-size: 12.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.75);
  margin: 0 0 18px;
  line-height: 1.4;
}

.profile-choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.profile-choice-card {
  border-radius: 16px;
  padding: 10px;
  border: 2px solid transparent;
  cursor: pointer;
  text-align: left;
  transition:
    transform 0.1s ease,
    border-color 0.15s ease;
}

.profile-choice-card:hover {
  transform: translateY(-2px);
}

.profile-choice-card:active {
  transform: scale(0.97);
}

.profile-choice-card.kids {
  background: linear-gradient(180deg, #ffe08a, var(--yellow));
}

.profile-choice-card.adult {
  background: #dfeeff;
}

.profile-choice-card.selected {
  border-color: #ffffff;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
}

.profile-choice-card .emoji {
  font-size: 22px;
  line-height: 1;
  margin-bottom: 8px;
}

.profile-choice-card .tag {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--navy);
  opacity: 0.65;
  margin-bottom: 4px;
}

.profile-choice-card .title {
  font-family: var(--font-title);
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 4px;
  line-height: 1.15;
}

.profile-choice-card .desc {
  font-size: 10px;
  font-weight: 600;
  color: var(--navy);
  opacity: 0.85;
  line-height: 1.3;
  margin-bottom: 7px;
}

.profile-choice-card .foot {
  font-size: 9.5px;
  font-weight: 800;
  color: var(--navy);
  opacity: 0.7;
}

.onboard-continue-bar {
  width: 100%;
  text-align: center;
  padding: 13px;
  border: none;
  border-radius: 14px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 12.5px;
  margin-top: 4px;
  background: rgba(155, 140, 40, 0.5);
  color: rgba(255, 255, 255, 0.65);
  cursor: not-allowed;
}

.onboard-continue-bar.enabled {
  background: var(--navy);
  color: #ffffff;
  cursor: pointer;
}

.onboard-continue-bar:disabled {
  opacity: 1;
}

.onboard-hint {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.6);
  margin-top: 12px;
}

/* ---------- Tela de abertura do aplicativo ---------- */
.splash-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  opacity: 1;
  transition: opacity 0.7s ease;
  cursor: pointer;
  touch-action: manipulation;
}
.senior-splash-screen {
  flex-direction: column;
  gap: 0;
  background: #1b364a;
}
body[data-theme="light"] .senior-splash-screen {
  background: #eaf4fb;
}
body[data-theme="light"] .senior-splash-screen .splash-welcome {
  color: #123b4d;
  text-shadow: none;
}
body[data-theme="light"] .senior-splash-screen .splash-hint {
  color: #456678;
  text-shadow: none;
}
body[data-theme="dark"] .senior-splash-screen {
  background: #1b364a;
}
body[data-theme="dark"] .senior-splash-screen .splash-welcome {
  color: #eff7ff;
}
body[data-theme="dark"] .senior-splash-screen .splash-hint {
  color: #d4eafb;
}
.senior-splash-screen:focus-visible {
  outline: 4px solid #f7c94d;
  outline-offset: -10px;
}
.splash-screen.splash-hidden {
  opacity: 0;
  pointer-events: none;
  display: none;
}
.splash-logo {
  width: min(72vw, 300px);
  height: auto;
  object-fit: contain;
  animation: splashLogoIn 0.9s ease-out both;
}
.splash-enter {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  touch-action: manipulation;
}
.splash-welcome {
  margin-top: 18px;
  text-align: center;
  color: #ffffff;
  font-family: 'Nunito', var(--font-title);
  font-size: clamp(32px, 9vw, 42px);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.035em;
  text-shadow: 0 3px 14px rgba(0, 0, 0, 0.22);
  opacity: 0;
  animation: splashFadeUp 0.8s ease-out 0.1s both;
}
.splash-hint {
  margin-top: 10px;
  text-align: center;
  color: #d4eafb;
  font-family: 'Nunito', var(--font);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.025em;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  opacity: 0;
  animation:
    splashFadeUp 0.8s ease-out 0.28s both,
    splashHintPulse 1.8s ease-in-out 1.2s infinite;
}
@keyframes splashLogoIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes splashFadeUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes splashHintPulse {
  0%, 100% {
    transform: scale(1);
    text-shadow: 0 0 0 rgba(212, 234, 251, 0);
  }
  50% {
    transform: scale(1.06);
    text-shadow: 0 0 12px rgba(212, 234, 251, 0.7);
  }
}
@media (prefers-reduced-motion: reduce) {
  .splash-logo { animation: none; }
  .splash-screen { transition: none; }
  .splash-welcome,
  .splash-hint {
    animation: none;
    opacity: 1;
    transform: none;
  }
}

/* Grade azul em movimento: decorativa, leve e sem bloquear os controles. */
body.layout-neutro::before {
  content: '';
  position: fixed;
  inset: -30vh -20vw;
  z-index: 0;
  pointer-events: none;
  opacity: 0.34;
  background-image:
    linear-gradient(90deg,
      rgba(32, 112, 174, 0.52) 0 78px,
      rgba(69, 165, 218, 0.42) 78px 156px,
      rgba(22, 82, 135, 0.52) 156px 234px,
      rgba(111, 197, 239, 0.38) 234px 312px),
    linear-gradient(0deg,
      transparent 0 76px,
      rgba(164, 225, 255, 0.2) 76px 78px,
      transparent 78px 154px,
      rgba(8, 61, 105, 0.24) 154px 156px);
  background-size: 312px 156px;
  background-position: 0 0;
  background-blend-mode: screen, multiply;
  animation: blueGridSlide 10s ease-in-out infinite alternate;
}

@keyframes blueGridSlide {
  from { background-position: 0 0; }
  to { background-position: 312px 0; }
}

@media (prefers-reduced-motion: reduce) {
  body.layout-neutro::before {
    animation: none;
  }
}

body.layout-neutro {
  background-color: #1b364a !important;
  background-image:
    linear-gradient(rgba(9, 43, 59, 0.58), rgba(9, 43, 59, 0.58)),
    url('assets/imagens/imagem-adulto.png') !important;

.switch {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  width: 54px;
  height: 32px;
  cursor: pointer;
}

.switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.switch-track {
  position: relative;
  width: 54px;
  height: 32px;
  border: 2px solid #6f91a8;
  border-radius: 999px;
  background: #345a74;
  transition: background .15s ease, border-color .15s ease;
}

.switch-track::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .15s ease;
}

.switch input:checked + .switch-track {
  background: #dca707;
  border-color: #ae8100;
}

.switch input:checked + .switch-track::after {
  transform: translateX(22px);
}

function getSettings() {
  const current = STATE.data.settings && typeof STATE.data.settings === 'object'
    ? STATE.data.settings
    : {};

  STATE.data.settings = {
    ...SETTINGS_DEFAULTS,
    ...current
  };

  return STATE.data.settings;
}

function applyAccessibilityTheme() {
  const settings = getSettings();
  const scales = [0.9, 1, 1.15, 1.35];
  const fontStep = Math.min(4, Math.max(1, Number(settings.fontStep) || 2));

  document.documentElement.style.setProperty(
    '--a11y-scale',
    scales[fontStep - 1]
  );
  document.body.dataset.theme = settings.darkTheme === false ? 'light' : 'dark';
}

let scanTimer = null;
let scanIndex = -1;
let scanScreen = '';

function clearScanHighlight() {
  document.querySelectorAll('.scan-active').forEach(element => {
    element.classList.remove('scan-active');
  });
}

function scanTargets() {
  return [...document.querySelectorAll(
    '#app button:not([disabled]), #app [role="button"]:not([aria-disabled="true"]), #app input:not([disabled]), #app select:not([disabled]), #app textarea:not([disabled])'
  )].filter(element => {
    const rect = element.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0 && !element.closest('[hidden]');
  });
}

function scheduleScan() {
  clearTimeout(scanTimer);
  scanTimer = null;
  clearScanHighlight();

  const settings = getSettings();
  const app = document.getElementById('app');
  if (!settings.scanEnabled || app?.getAttribute('aria-hidden') === 'true') return;

  const targets = scanTargets();
  if (!targets.length) return;

  if (scanScreen !== STATE.screen) {
    scanScreen = STATE.screen;
    scanIndex = -1;
  }

  scanIndex = (scanIndex + 1) % targets.length;
  const target = targets[scanIndex];
  target.classList.add('scan-active');
  target.closest('.switch')?.classList.add('scan-active');
  target.focus({ preventScroll: true });

  const scanSpeed = Math.min(5000, Math.max(600, Number(settings.scanSpeed) || 1800));
  scanTimer = setTimeout(scheduleScan, scanSpeed);
}

  try {

    const raw = localStorage.getItem(STORAGE_KEY);

    if (raw) {

      const parsed = JSON.parse(raw);

      STATE.data = {

        ...STATE.data,

        ...parsed,

        profile: {
          ...STATE.data.profile,
          ...(parsed.profile || {})
        }

      };

    }

  } catch (error) {

    console.error(
      'Erro ao carregar os dados:',
      error
    );

  }

  const shouldGoToProfileSelection =
    localStorage.getItem(
      'comunica:goToProfileSelection'
    ) === '1';

  const isLogoutLoading =
    localStorage.getItem('comunica:logoutLoading') === '1';

  localStorage.removeItem('comunica:logoutLoading');

  window.autoDismissSplash =
    isLogoutLoading ||
    shouldGoToProfileSelection ||
    STATE.data.profile.onboarded;

  window.playLogoutMusic = isLogoutLoading;

  if (isLogoutLoading) {
    STATE.screen = 'login';

  } else if (shouldGoToProfileSelection) {

    STATE.screen = 'chooseProfile';

  } else if (!STATE.data.profile.onboarded) {

    STATE.screen = 'login';

  }

  loadLayer();

  render();

}

function showAccessibleConfirm(message, onConfirm) {
  document.querySelector('.confirm-dialog')?.remove();
  const dialog = document.createElement('div');
  dialog.className = 'confirm-dialog';
  dialog.setAttribute('role', 'alertdialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.innerHTML = `<div class="confirm-dialog-panel" role="document">
    <p class="confirm-dialog-message">${message}</p>
    <div class="confirm-dialog-actions">
      <button type="button" class="confirm-dialog-confirm">Confirmar</button>
      <button type="button" class="confirm-dialog-cancel">Cancelar</button>
    </div>
  </div>`;
  document.body.appendChild(dialog);
  const confirmButton = dialog.querySelector('.confirm-dialog-confirm');
  const cancelButton = dialog.querySelector('.confirm-dialog-cancel');
  const close = () => dialog.remove();
  confirmButton.addEventListener('click', () => { close(); onConfirm(); });
  cancelButton.addEventListener('click', close);
  dialog.addEventListener('keydown', event => {
    if (event.key === 'Escape') { event.preventDefault(); close(); return; }
    if (['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'].includes(event.key)) {
      event.preventDefault();
      (document.activeElement === confirmButton ? cancelButton : confirmButton).focus();
      return;
    }
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      document.activeElement?.click();
    }
  });
  confirmButton.focus();
}


let speechRequestId = 0;

function preferredPortugueseVoice() {
  const voices = window.speechSynthesis.getVoices();
  const normalizedVoices = voices.map(voice => ({
    voice,
    name: (voice.name || '').toLowerCase(),
    lang: (voice.lang || '').toLowerCase()
  }));

  // O nome da voz varia entre Chrome, Android e Windows, por isso há alternativas.
  return normalizedVoices.find(({ name, lang }) =>
    lang === 'pt-br' &&
    name.includes('google') &&
    (name.includes('portugu') || name.includes('brazil') || name.includes('brasil'))
  )?.voice ||
  normalizedVoices.find(({ name, lang }) => lang === 'pt-br' && name.includes('google'))?.voice ||
  normalizedVoices.find(({ lang }) => lang === 'pt-br')?.voice ||
  normalizedVoices.find(({ lang }) => lang.startsWith('pt'))?.voice;
}

function speak(text) {
  if (!('speechSynthesis' in window)) {
    showToast('A voz não é suportada neste navegador.');
    return;
  }

  if (!text) return;

  const requestId = ++speechRequestId;
  let speechStarted = false;
  const speakNow = () => {
    if (requestId !== speechRequestId || speechStarted) return;
    speechStarted = true;

    const settings = getSettings();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'pt-BR';
    utterance.rate = Math.min(1.2, Math.max(0.5, Number(settings.voiceRate) || 0.8));
    utterance.pitch = 1;

    const ptVoice = preferredPortugueseVoice();
    if (ptVoice) utterance.voice = ptVoice;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  };

  if (window.speechSynthesis.getVoices().length) {
    speakNow();
    return;
  }

  window.speechSynthesis.addEventListener('voiceschanged', speakNow, { once: true });
  setTimeout(speakNow, 250);
}



function go(screen, extra = {}) {

  STATE.screen = screen;

  Object.assign(
    STATE,
    extra
  );

  if (screen !== 'challenge') {

    STATE.challenge = null;

  }

  if (screen !== 'profile') {

    STATE.layoutPromptVisible = false;

    STATE.editingProfileName = false;

  }

  render();

  window.scrollTo(
    0,
    0
  );

}



function addWordToPhrase(word) {

  if (!word) return;

  STATE.phrase.push(word);

  STATE.data.profile.wordsUsed =
    (STATE.data.profile.wordsUsed || 0) + 1;

  saveData();

  loadLayer();

  render();

}

function eraseLast() {

  if (STATE.phrase.length === 0) {

    showToast('Não há palavras para apagar.');

    return;

  }

  speak('Apagar');

  STATE.phrase.pop();

  loadLayer();

  render();

}

function clearPhrase() {
  if (STATE.phrase.length > 0) {
    showAccessibleConfirm('Deseja limpar toda a frase?', clearPhraseConfirmed);
    return;
  }
  clearPhraseConfirmed();
}

function clearPhraseConfirmed() {
  if (STATE.phrase.length > 0) speak('Limpar frase');
  STATE.phrase = [];

  loadLayer();

  render();

}

function currentPhraseText() {

  return STATE.phrase
    .map(word => word.label)
    .join(' ');

}



function favoritePhrase() {

  if (STATE.phrase.length === 0) {

    showToast(
      'Monte uma frase primeiro.'
    );

    return;

  }

  const text =
    currentPhraseText();

  if (
    !STATE.data.favPhrases.includes(text)
  ) {

    STATE.data.favPhrases.push(text);

    STATE.data.profile.wordsSaved =
      (STATE.data.profile.wordsSaved || 0) + STATE.phrase.length;

    saveData();

    showToast(
      'Frase adicionada aos favoritos '
    );

  } else {

    showToast(
      'Essa frase já está nos favoritos.'
    );

  }

  render();

}



function currentLayerKey() {

  const last =
    STATE.phrase[
      STATE.phrase.length - 1
    ];

  return last
    ? last.id
    : '__start__';

}

function loadLayer() {

  const key =
    currentLayerKey();

  let suggestions =
    SUGGESTIONS[key] || [];

  

  const customWords =
    STATE.data.customWords
      .filter(word =>
        !suggestions.includes(word.id)
      )
      .map(word => word.id);

  const combined =
    suggestions.concat(customWords);

  STATE.options =
    combined.filter(
      id => wordById(id)
    );

  if (
    STATE.carouselIndex >=
    STATE.options.length
  ) {

    STATE.carouselIndex = 0;

  }

}

function moveCarousel(delta) {

  if (
    STATE.options.length === 0
  ) {

    return;

  }

  const total =
    STATE.options.length;

  STATE.carouselIndex =
    (
      STATE.carouselIndex +
      delta +
      total
    ) % total;

  render();

}

function confirmSelection() {

  if (
    STATE.options.length === 0
  ) {

    showToast(
      'Não há mais opções.'
    );

    return;

  }

  const id =
    STATE.options[
      STATE.carouselIndex
    ];

  const word =
    wordById(id);

  if (!word) return;

  STATE.phrase.push(word);

  if (STATE.phrase.length === 3) {
    setTimeout(() => {
      speak(currentPhraseText());
    }, 250);
  } else {
    speak(word.label);
  }

  STATE.carouselIndex = 0;

  loadLayer();

  render();

}

function speakPhrase() {

  const text =
    currentPhraseText();

  if (text) {

    const spokenWords =
      text.trim().split(/\s+/).filter(Boolean).length;

    STATE.data.profile.wordsUsed =
      (STATE.data.profile.wordsUsed || 0) + spokenWords;

    saveData();

    speak(text);

  }

}



function isFavoriteWord(wordId) {
  return STATE.data.favWords.includes(wordId);
}

function toggleFavoriteWord(wordId) {
  const index = STATE.data.favWords.indexOf(wordId);

  if (index >= 0) {
    showAccessibleConfirm('Remover esta palavra dos favoritos?', () => {
      STATE.data.favWords.splice(index, 1);
      showToast('Palavra removida dos favoritos.');
      saveData();
      render();
    });
    return;
  } else {
    STATE.data.favWords.push(wordId);
    showToast('Palavra adicionada aos favoritos ⭐');
  }

  saveData();
  render();
}

function favoriteLastWord() {
  const word = STATE.phrase[STATE.phrase.length - 1];

  if (!word) {
    showToast('Selecione uma palavra primeiro.');
    return;
  }

  if (isFavoriteWord(word.id)) {
    showToast('Palavra já adicionada aos favoritos.');
    return;
  }

  toggleFavoriteWord(word.id);
}

function wordCardHtml(word, selected = false, inFavorites = false) {
  const favorite = isFavoriteWord(word.id);

  return `
    <div class="word-card ${selected ? 'selected' : ''}" data-word="${word.id}" ${inFavorites ? 'data-favorite-word-card' : ''}>
      ${!inFavorites ? `
        <button type="button" class="favorite-toggle ${favorite ? 'is-favorite' : ''}"
          data-fav-word="${word.id}"

          title="${favorite ? 'Palavra já adicionada' : 'Adicionar aos favoritos'}">

        <button type="button" class="word-favorite-remove"

}


function render() {

  const app =
    document.getElementById('app');

  if (!app) return;

  let html = '';

  switch (STATE.screen) {

    case 'login':
      html = renderLogin();
      break;

    case 'chooseProfile':
      html = renderChooseProfile();
      break;

    case 'home':
      html = renderHome();
      break;

    case 'build':
      html = renderBuild();
      break;

    case 'circularMode':
      html = renderModeScreen('circular');
      break;

    case 'carouselMode':
      html = renderModeScreen('carousel');
      break;

    case 'categories':
      html = renderCategories();
      break;

    case 'categoryDetail':
      html = renderCategoryDetail();
      break;

    case 'favorites':
      html = renderFavorites();
      break;

    case 'personalize':
      html = renderPersonalize();
      break;

    case 'challenge':
      html = renderChallenge();
      break;

    case 'profile':
      html = renderProfile();
      break;

    case 'settings':
      html = renderSettings();
      break;

    case 'about':
      html = renderAbout();
      break;

    default:
      html = renderHome();

  }

  app.innerHTML = html;

  if (STATE.screen === 'chooseProfile') {
    pararMusica();
  }

  if (STATE.screen === 'circularMode') {
    initCircularKeyboard();
  }

  renderLineIcons();



  if (
    STATE.screen === 'home' ||
    STATE.screen === 'login' ||
    STATE.screen === 'chooseProfile'
  ) {

    document.body.classList.remove(
      'bg-outras'
    );

  } else {

    document.body.classList.add(
      'bg-outras'
    );

  }

  applyLayoutClass();

  document.body.classList.toggle(
    'profile-selection',
    STATE.screen === 'chooseProfile'
  );

  attachHandlers();
  scheduleScan();

}

  const isEntryScreen =
    STATE.screen === 'login' ||
    STATE.screen === 'chooseProfile';

  const layout = !isEntryScreen && STATE.data.profile.layout === 'infantil'
    ? 'infantil'
    : 'neutro';

    'layout-infantil',
    layout === 'infantil'
  );

    'layout-neutro',
    layout === 'neutro'
  );

}



function setLayout(layout) {

  STATE.data.profile.layout =
    layout === 'infantil' ? 'infantil' : 'neutro';

  render();

}



function toggleLayout() {

  const current =
    STATE.data.profile.layout === 'infantil'

    current === 'infantil' ? 'neutro' : 'infantil'

function renderModeScreen(mode) {
  if (mode === 'circular') return renderCircularKeyboard();

function renderCarouselMode() {
  const chipHtml = STATE.phrase.length
    ? STATE.phrase.map(word => `<span class="phrase-chip">${word.emoji} ${word.label}</span>`).join('')
    : `<span class="phrase-placeholder">Escolha uma palavra no carrossel...</span>`;
  const n = STATE.options.length;
  let cardsHtml = '';

  if (n === 0) {
    cardsHtml = `<div class="carousel-empty">Você chegou ao fim da frase.<br><br>Toque em <strong>Limpar</strong> para começar novamente.</div>`;
  } else {
    const prevId = n > 1 ? STATE.options[(STATE.carouselIndex - 1 + n) % n] : null;
    const nextId = n > 1 ? STATE.options[(STATE.carouselIndex + 1) % n] : null;
    const curId = STATE.options[STATE.carouselIndex];
    const card = (id, type) => {
      if (!id) return `<div class="carousel-card ${type} empty"></div>`;
      const word = wordById(id);
      if (!word) return `<div class="carousel-card ${type} empty"></div>`;
      return `<div class="carousel-card ${type}" data-pick="${id}" role="button" tabindex="${type === 'center' ? '0' : '-1'}" aria-label="${word.label}"><div class="emoji">${word.emoji}</div><div class="label">${word.label}</div></div>`;
    };
    cardsHtml = `<button class="carousel-arrow" id="prevBtn" ${n < 2 ? 'disabled' : ''} aria-label="Palavra anterior">‹</button><div class="carousel-track">${card(prevId, 'side')}${card(curId, 'center')}${card(nextId, 'side')}</div><button class="carousel-arrow" id="nextBtn" ${n < 2 ? 'disabled' : ''} aria-label="Próxima palavra">›</button>`;
  }

  const layerLabel = STATE.phrase.length === 0 ? 'QUEM ESTÁ FALANDO?' : STATE.phrase.length === 1 ? 'O QUE VOCÊ QUER DIZER?' : 'COMPLETE A FRASE';
  return `<div class="carousel-full-screen"><div class="carousel-full-topbar"><button class="icon-btn" data-go="build" aria-label="Voltar para escolha do modo">←</button><div class="topbar-title">Comunicar</div><button class="icon-btn" data-go="personalize" aria-label="Personalizar">⚙︎</button></div><div class="carousel-full-content"><div class="section-label">MINHA FRASE</div><div class="phrase-bar" role="group" aria-label="Minha frase">${chipHtml}</div><div class="layer-label">${layerLabel}</div><div class="carousel-wrap">${cardsHtml}</div><button class="confirm-btn" id="confirmBtn" ${n === 0 ? 'disabled' : ''}>✓ Selecionar</button><div class="action-row"><button class="btn-erase" id="eraseBtn">Apagar</button><button class="btn-clear" id="clearBtn">Limpar</button><button class="btn-speak" id="speakBtn" ${STATE.phrase.length ? '' : 'disabled'}>Falar</button><button class="btn-fav" id="favPhraseBtn" ${STATE.phrase.length ? '' : 'disabled'}>Favorizar frase</button><button class="btn-fav-word" id="favWordBtn" ${STATE.phrase.length ? '' : 'disabled'}>Favoritar palavra</button></div><div class="back-link" data-go="categories" style="margin-top:4px;">Ver todas as categorias</div><div class="hint">← → navega · Enter/Espaço seleciona · toque também funciona</div></div></div>`;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderChallenge() {

  if (!STATE.challenge) {

    STATE.challenge =
      CHALLENGES[
        Math.floor(
          Math.random() *
          CHALLENGES.length
        )
      ];

    STATE.phrase = [];

  }

  const challenge =
    STATE.challenge;

  const done =
    STATE.phrase.length > 0 &&
    STATE.phrase
      .map(
        word => word.id
      )
      .join(',') ===
      challenge.target.join(',');

  const targetWords =
    allWords().filter(
      word =>
        challenge.target.includes(
          word.id
        )
    );

  const targetCategories =
    new Set(
      targetWords.map(
        word => word.cat
      )
    );

  const distractors =
    allWords()
      .filter(
        word =>
          targetCategories.has(
            word.cat
          ) &&
          !challenge.target.includes(
            word.id
          )
      )
      .slice(0, 5);

  let options =
    targetWords.concat(
      distractors
    );

  options =
    options.sort(
      () =>
        Math.random() - 0.5
    );

  return `

    <div class="topbar">

      <button
        class="icon-btn"
        data-go="home"
      >
        ←
      </button>

      <div class="topbar-title">
        Desafio
      </div>

      <div style="width:44px"></div>

    </div>

    <div class="screen">

      <div class="stars">
        
        ${STATE.data.profile.stars}
        estrelas
      </div>

      <div class="challenge-card">

        <div class="emoji">
          ${challenge.emoji}
        </div>

        <p>
          ${challenge.prompt}
        </p>

      </div>

      <div class="section-label">
        MINHA FRASE
      </div>

      <div class="phrase-bar">

        ${
          STATE.phrase.length

            ? STATE.phrase
                .map(
                  word => `

                    <span class="phrase-chip">
                      ${word.emoji}
                      ${word.label}
                    </span>

                  `
                )
                .join('')

            : `

              <span class="phrase-placeholder">
                Monte a frase certa...
              </span>

            `
        }

      </div>

      <div class="action-row">

        <button
          class="btn-erase"
          id="eraseBtn"
        >
          ⌫ Apagar
        </button>

        <button
          class="btn-clear"
          id="clearBtn"
        >
           Limpar
        </button>

      </div>

      <div class="section-label">
        MONTE A RESPOSTA
      </div>

      <div class="word-grid">

        ${options
          .map(
            word =>
              wordCardHtml(
                word,
                false
              )
          )
          .join('')}

      </div>

      ${
        done

          ? `

            <button
              class="speak-btn"
              id="challengeWinBtn"
            >
               Muito bem! Ganhar estrela
            </button>

          `

          : `

            <button
              class="speak-btn"
              id="speakBtn"
              ${
                STATE.phrase.length
                  ? ''
                  : 'disabled'
              }
            >
               Ouvir minha frase
            </button>

          `
      }

      <div
        class="back-link"
        style="margin-top:14px;"
        id="skipChallenge"
      >
        ↻ Tentar outro desafio
      </div>

    </div>

  `;

}

        <div class="settings-row"><div><div class="settings-label">Modo de varredura</div><div class="settings-desc">O foco amarelo passa pelos controles. Pressione Enter, Espaço ou o centro do analógico para escolher o controle destacado.</div></div><label class="switch"><input id="seniorScanToggle" type="checkbox" ${s.scanEnabled ? 'checked' : ''}><span class="switch-track"></span></label></div>

function updateAccessibilitySettings(changes) {
  const settings = getSettings();
  Object.assign(settings, changes);
  saveData();
  applyAccessibilityTheme();
  render();
}

function attachHandlers() {


  prepareKeyboardNavigation();

  const settings = getSettings();
  const fontDown = document.getElementById('seniorFontDown');
  const fontUp = document.getElementById('seniorFontUp');
  if (fontDown) fontDown.addEventListener('click', () => updateAccessibilitySettings({ fontStep: Math.max(1, (settings.fontStep || 2) - 1) }));
  if (fontUp) fontUp.addEventListener('click', () => updateAccessibilitySettings({ fontStep: Math.min(4, (settings.fontStep || 2) + 1) }));
  const darkToggle = document.getElementById('seniorDarkToggle');
  if (darkToggle) darkToggle.addEventListener('change', event => updateAccessibilitySettings({ darkTheme: event.target.checked }));
  const scanToggle = document.getElementById('seniorScanToggle');
  if (scanToggle) scanToggle.addEventListener('change', event => updateAccessibilitySettings({ scanEnabled: event.target.checked }));
  const scanSlow = document.getElementById('seniorScanSlow');
  const scanFast = document.getElementById('seniorScanFast');
  if (scanSlow) scanSlow.addEventListener('click', () => updateAccessibilitySettings({ scanSpeed: Math.min(5000, (settings.scanSpeed || 1800) + 300) }));
  if (scanFast) scanFast.addEventListener('click', () => updateAccessibilitySettings({ scanSpeed: Math.max(600, (settings.scanSpeed || 1800) - 300) }));
  const voiceSlow = document.getElementById('seniorVoiceSlow');
  const voiceFast = document.getElementById('seniorVoiceFast');
  if (voiceSlow) voiceSlow.addEventListener('click', () => updateAccessibilitySettings({ voiceRate: Math.max(0.5, Math.round(((settings.voiceRate || 0.8) - 0.1) * 10) / 10) }));
  if (voiceFast) voiceFast.addEventListener('click', () => updateAccessibilitySettings({ voiceRate: Math.min(1.2, Math.round(((settings.voiceRate || 0.8) + 0.1) * 10) / 10) }));

  const saveFeedbackBtn = document.getElementById('saveFeedbackBtn');
  if (saveFeedbackBtn) {
    saveFeedbackBtn.addEventListener('click', () => {
      const input = document.getElementById('feedbackText');
      if (!input) return;
      STATE.data.profile.feedback = input.value.trim();
      saveData();
      showToast('Feedback salvo!');
      speak('Feedback salvo');
      render();
    });
  }

  document.querySelectorAll('[data-mode-screen]').forEach(element => {
    element.addEventListener('click', () => {
      go(element.getAttribute('data-mode-screen'));
    });
  });

  const loginContinueBtn =
    document.getElementById(
      'loginContinueBtn'
    );

  if (loginContinueBtn) {

    loginContinueBtn.addEventListener(
      'click',
      () => {

        const input =
          document.getElementById(
            'loginName'
          );

        const name =
          input
            ? input.value.trim()
            : '';

        if (name === '') {

          showToast(
            'Digite seu nome para continuar'
          );

          return;

        }

        STATE.data.profile.name = name;

        saveData();

        speak(
          'Olá, ' + name
        );

        go('chooseProfile');

      }
    );

  }


  const adultProfileCard =
    document.querySelector(
      '[data-profile-type="adulto"]'
    );

  if (adultProfileCard) {

    adultProfileCard.addEventListener(
      'click',
      () => {

        localStorage.removeItem(
          'comunica:goToProfileSelection'
        );

        STATE.data.profile.layout = 'neutro';

        STATE.data.profile.onboarded = true;

        saveData();

        if (typeof window.showSeniorSplash === 'function') {
          window.showSeniorSplash();
        }

        go('home');

      }
    );

  }


  const kidsProfileCard =
    document.querySelector(
      '[data-profile-type="infantil"]'
    );

  if (kidsProfileCard) {

    kidsProfileCard.addEventListener(
      'click',
      () => {

        localStorage.removeItem(
          'comunica:goToProfileSelection'
        );

        STATE.data.profile.layout = 'infantil';

        STATE.data.profile.onboarded = true;

        saveData();

        localStorage.setItem(
          'comunica:juniorEntryMode',
          '1'
        );

         window.location.href = 'infantil.html';

      }
    );

  }



  document
    .querySelectorAll('[data-go]')
    .forEach(element => {

      element.addEventListener(
        'click',
        () => {

          const target =
            element.getAttribute(
              'data-go'
            );

          const menuTexts = {

            build:
              'Começar a comunicar',

            favorites:
              'Favoritos',

            categories:
              'Categorias',

            personalize:
              'Personalizar',

            challenge:
              'Desafio da comunicação',

            profile:
              'Perfil',

            about:
              'Sobre o Comunica'

          };

          if (
            menuTexts[target]
          ) {

            speak(
              menuTexts[target]
            );

function prepareKeyboardNavigation() {

  const selector = [
    'button:not([disabled])',
    '[data-go]',
    '[data-word]',
    '[data-category]',
    '[data-pick]',
    '[data-fav-word]',
    '[data-del-word]',
    '[data-del-cat]',
    '[data-profile-type]',
    '.emoji-pick'
  ].join(',');

  document.querySelectorAll(selector).forEach(element => {
    if (element.matches('button, input, select, textarea')) return;

    if (!element.hasAttribute('tabindex')) {
      element.setAttribute('tabindex', '0');
    }

    if (!element.hasAttribute('role')) {
      element.setAttribute('role', 'button');
    }
  });
}


function keyboardTargets() {

  const dialog = document.querySelector('.confirm-dialog');
  if (dialog) return [...dialog.querySelectorAll('button:not([disabled])')];

  const selector = [
    'button:not([disabled])',
    '[data-go]',
    '[data-word]',
    '[data-category]',
    '[data-pick]',
    '[data-fav-word]',
    '[data-del-word]',
    '[data-del-cat]',
    '[data-profile-type]',
    '.emoji-pick',
    'input:not([disabled])',
    'select:not([disabled])',
    'textarea:not([disabled])'
  ].join(',');

  return [...document.querySelectorAll(selector)].filter(element => {
    const rect = element.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0 && !element.closest('[hidden]');
  });
}


function moveKeyboardFocus(direction) {

  const targets = keyboardTargets();
  const current = document.activeElement;

  const markControlFocus = element => {
    document.querySelectorAll('.accessibility-focus').forEach(item => item.classList.remove('accessibility-focus'));
    element?.classList.add('accessibility-focus');
    element?.closest('.switch')?.classList.add('accessibility-focus');
  };

  if (!targets.length) return;

  if (!targets.includes(current)) {
    targets[0].focus();
    markControlFocus(targets[0]);
    return;
  }

  const index = targets.indexOf(current);

  if (index === -1) {
    targets[0].focus();
    markControlFocus(targets[0]);
    return;
  }

  const goingForward =
    direction === 'ArrowRight' ||
    direction === 'ArrowDown';

  const nextIndex =
    (
      index +
      (goingForward ? 1 : -1) +
      targets.length
    ) % targets.length;

  targets[nextIndex].focus();
  markControlFocus(targets[nextIndex]);

}


document.addEventListener('keydown', event => {

  // O teclado circular controla as próprias setas. Não deixar o atalho global
  // de acessibilidade mover o foco para outro controle antes do handler do anel.
  if (STATE.screen === 'circularMode') return;

  const active = document.activeElement;
  const tag = active?.tagName;

  const isArrow =
    ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']
      .includes(event.key);

  if (tag === 'INPUT' || tag === 'TEXTAREA') {

    if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
      event.preventDefault();
      moveKeyboardFocus(event.key);
      return;
    }

    if (isArrow) {

      const atStart =
        active.selectionStart === 0 &&
        active.selectionEnd === 0;

      const atEnd =
        active.selectionStart === active.value.length &&
        active.selectionEnd === active.value.length;

      const canLeave =
        (event.key === 'ArrowLeft' && atStart) ||
        (event.key === 'ArrowRight' && atEnd);

      if (canLeave) {
        event.preventDefault();
        moveKeyboardFocus(event.key);
      }

      return;

    }

    return;

  }

  if (tag === 'SELECT') {

    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      moveKeyboardFocus(event.key);
    }

    return;

  }

  if (event.defaultPrevented) return;

  if (event.key === 'Escape') {
    event.preventDefault();
    if (STATE.screen !== 'home' && STATE.screen !== 'login' && STATE.screen !== 'chooseProfile') {
      go('home');
    } else {
      document.activeElement?.blur();
    }
    return;
  }

  if (isArrow) {
    event.preventDefault();
    moveKeyboardFocus(event.key);
    return;
  }

  if (
    (event.key === 'Enter' || event.key === ' ') &&
    document.activeElement?.matches('[role="button"]:not(button)')
  ) {
    event.preventDefault();
    document.activeElement.click();
  }
});



document.addEventListener(
  'keydown',
  event => {

    if (event.defaultPrevented) {
      return;
    }

    

    if (
      STATE.screen !== 'build'
    ) {

      return;

    }

   

    const tag =
      document.activeElement
        ?.tagName;

    if (
      tag === 'INPUT' ||
      tag === 'TEXTAREA' ||
      tag === 'SELECT'
    ) {

      return;

    }

    if (
      event.key === 'ArrowLeft'
    ) {

      event.preventDefault();

      moveCarousel(-1);

    }

    else if (
      event.key === 'ArrowRight'
    ) {

      event.preventDefault();

      moveCarousel(1);

    }

    else if (
      event.key === 'Enter' ||
      event.key === ' '
    ) {

      const focused =
        document.activeElement;

   
      if (
        focused &&
        focused.tagName === 'BUTTON'
      ) {

        return;

      }

      event.preventDefault();

      confirmSelection();

    }

    else if (
      event.key === 'Backspace'
    ) {

      event.preventDefault();

      eraseLast();

    }

    else if (
      event.key === 'Escape'
    ) {

      event.preventDefault();

      clearPhrase();

    }

  }
);

function initSeniorSplash() {
  const splash = document.getElementById('seniorSplashScreen');
  const app = document.getElementById('app');

  if (!splash || !app) return;

  let encerrado = true;

  const entrarNoAplicativo = () => {
    if (encerrado) return;
    encerrado = true;
    splash.classList.add('splash-hidden');
    app.removeAttribute('aria-hidden');

    setTimeout(() => {
      splash.style.display = 'none';
    }, 700);
  };

  window.showSeniorSplash = () => {
    encerrado = false;
    splash.style.display = 'flex';
    splash.classList.remove('splash-hidden');
    app.setAttribute('aria-hidden', 'true');
    splash.focus({ preventScroll: true });
    splash.addEventListener('pointerdown', entrarNoAplicativo, { once: true });
    splash.addEventListener('click', entrarNoAplicativo, { once: true });
    splash.addEventListener('touchend', entrarNoAplicativo, { once: true });
  };

  splash.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      entrarNoAplicativo();
    }
  });
}

const FIRST_OPEN_MUSIC_KEY = 'comunica:firstOpenMusicPlayed:v4';

function iniciarMusicaUmaVez() {
  const musica = document.getElementById('appMusic');
  if (!musica) return;

  if (window.playLogoutMusic) {
    musica.removeAttribute('loop');
    musica.loop = false;
    musica.autoplay = true;
    musica.playsInline = true;
    musica.volume = 0.35;
    musica.play().catch((erro) => {
      console.warn('O navegador bloqueou o autoplay:', erro);
    });
    return;
  }

  if (window.autoDismissSplash) {
    musica.pause();
    return;
  }

  if (localStorage.getItem(FIRST_OPEN_MUSIC_KEY) === '1') {
    musica.pause();
    return;
  }

  musica.removeAttribute('loop');
  musica.loop = false;
  musica.autoplay = true;
  musica.playsInline = true;
  musica.volume = 0.35;
  musica.addEventListener('timeupdate', () => {
    if (musica.currentTime > 0.1) {
      localStorage.setItem(FIRST_OPEN_MUSIC_KEY, '1');
    }
  }, { once: true });

  const tocarMusica = () => musica.play()
    .catch((erro) => {
      console.warn('O navegador bloqueou o autoplay:', erro);
    });

  tocarMusica();
}

function pararMusica() {
  const musica = document.getElementById('appMusic');
  if (!musica) return;

  musica.removeAttribute('loop');
  musica.loop = false;
  musica.pause();
  musica.currentTime = 0;
}

/* Controle por joystick/gamepad: analógico navega, clique no analógico seleciona e B volta. */
function initGamepadControls() {
  if (!('getGamepads' in navigator)) return;
  let previous = [];
  let lastAxisMove = 0;

  const press = (pad, index) => Boolean(pad.buttons[index]?.pressed);
  const rising = (pad, index) => press(pad, index) && !previous[index];
  const markGamepadFocus = element => {
    document.querySelectorAll('.accessibility-focus').forEach(item => item.classList.remove('accessibility-focus'));
    element?.classList.add('accessibility-focus');
    element?.closest('.switch')?.classList.add('accessibility-focus');
  };

  const poll = timestamp => {
    const pad = [...(navigator.getGamepads?.() || [])].find(Boolean);
    if (pad) {
      if (rising(pad, 0) || rising(pad, 10)) {
        const seniorSplash = document.getElementById('seniorSplashScreen');
        const splashVisible = seniorSplash && !seniorSplash.classList.contains('splash-hidden')
          && seniorSplash.style.display !== 'none';
        if (splashVisible) {
          seniorSplash.click();
          previous = pad.buttons.map(button => Boolean(button.pressed));
          requestAnimationFrame(poll);
          return;
        }
        const active = document.activeElement;
        if (active && active !== document.body && typeof active.click === 'function') {
          markGamepadFocus(active);
          active.click();
        } else {
          const firstTarget = document.querySelector('#app button:not([disabled]), #app [role="button"]');
          firstTarget?.focus();
          markGamepadFocus(firstTarget);
        }
      }
      if (rising(pad, 1)) {
        const dialogCancel = document.querySelector('.confirm-dialog-cancel');
        if (dialogCancel) {
          dialogCancel.click();
        } else if (STATE.screen !== 'home' && STATE.screen !== 'login' && STATE.screen !== 'chooseProfile') {
          go('home');
        }
      }
      if (timestamp - lastAxisMove > 180) {
        const x = pad.axes[0] || 0;
        const y = pad.axes[1] || 0;
          const direction = Math.abs(x) > 0.4 ? (x > 0 ? 'ArrowRight' : 'ArrowLeft') : Math.abs(y) > 0.4 ? (y > 0 ? 'ArrowDown' : 'ArrowUp') : null;
        if (direction) {
          moveKeyboardFocus(direction);
          markGamepadFocus(document.activeElement);
          lastAxisMove = timestamp;
        }
      }
      previous = pad.buttons.map(button => Boolean(button.pressed));
    }
    requestAnimationFrame(poll);
  };

  requestAnimationFrame(poll);
}
