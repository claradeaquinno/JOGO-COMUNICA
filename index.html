<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>Comunica</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --sky-top: #bfe1ff;
  --sky-bottom: #edf8ff;
  --sky-glow: #dff3ff;
  --yellow: #f7c94d;
  --yellow-dark: #d9a314;
  --navy: #103d5d;
  --navy-soft: #ffffff;
  --card: #0d3556;
  --card-border: rgba(18, 60, 90, 0.16);
  --green: #1c5873;
  --red: #1c5873;
  --white: #ffffff;
  --radius: 18px;
  --font: 'Manrope', sans-serif;
  --font-title: 'Manrope', sans-serif;
}

body[data-theme="dark"] {
  --sky-top: #0b1f31;
  --sky-bottom: #102f48;
  --sky-glow: #173a56;
  --navy: #eff7ff;
  --navy-soft: #d4e6f5;
  --card: #17344d;
  --card-border: #3f6685;
  --white: #eff7ff;
  background: #0b1f31 !important;
  color: #eff7ff !important;
}

body[data-theme="dark"] #app,
body[data-theme="dark"] .app {
  color: #eff7ff;
}

body[data-theme="dark"] .splash-screen {
  background: #0b1f31 !important;
  color: #eff7ff;
}

body[data-theme="dark"] .form-block,
body[data-theme="dark"] .info-block,
body[data-theme="dark"] .word-card,
body[data-theme="dark"] .cat-card,
body[data-theme="dark"] .category-card,
body[data-theme="dark"] .fav-item,
body[data-theme="dark"] .challenge-card,
body[data-theme="dark"] .profile-choice-card,
body[data-theme="dark"] .menu-btn {
  background: #17344d !important;
  color: #eff7ff !important;
  border-color: #3f6685 !important;
}

body[data-theme="dark"] input,
body[data-theme="dark"] select,
body[data-theme="dark"] textarea,
body[data-theme="dark"] .phrase-bar {
  background: #0f293e !important;
  color: #eff7ff !important;
  border-color: #4f7898 !important;
}

body[data-theme="dark"] .word-card .label,
body[data-theme="dark"] .word-card .description,
body[data-theme="dark"] .cat-card .label,
body[data-theme="dark"] .cat-card .count,
body[data-theme="dark"] .menu-title,
body[data-theme="dark"] .menu-sub,
body[data-theme="dark"] label,
body[data-theme="dark"] p {
  color: #eff7ff !important;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: calc(100% * var(--a11y-scale, 1));
}

button,
[role="button"],
[data-go],
[data-word],
[data-category],
.menu-btn,
.word-card,
.cat-card,
.about-link,
.back-link {
  touch-action: manipulation;
}

html,
body {
   width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-glow) 26%, var(--sky-bottom) 100%);
    color: var(--navy);
}
#app {
    width: 100%;
    max-width: none;
    min-height: 100vh;
    border: none;
    outline: none;
    box-shadow: none;
    background: transparent;
}

body,.bg-outras{
    font-family: var(--font);
    background-image: none !important;
    background-size: auto;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}



#app,
.app {
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: clamp(12px, 3vw, 32px);
}
.topbar{
  display: flex;
  gap: 0.5rem;
}

.topbar,
.app-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 14px;
}

.topbar-title {
  font-family: var(--font-title);
  font-size: 18px;
  font-weight: 800;
  color: var(--white);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  text-align: center;
}

.icon-btn,
.profile-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  color: var(--navy);
  box-shadow: 0 4px 8px rgba(23, 58, 94, 0.15);
  backdrop-filter: blur(5px);
  transition: transform 0.15s ease, background 0.15s ease;
}

.icon-btn:hover,
.profile-btn:hover {
  transform: scale(1.05);
}

.icon-btn:active,
.profile-btn:active {
  transform: scale(0.94);
}


.home-hero {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 8px;
  margin-bottom: 12px;
}


.hero-cover-img {
  width: 100%;
  max-width: 430px;
  height: auto;
  display: block;
  border-radius: 18px;
  object-fit: contain;
}

.menu {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.home-screen {
  
  display: grid;
  justify-content: center;
  text-align: left;
  gap:2rem
}

.brand-intro {
  margin: 12px 0 26px;
  padding: 10px 4px;
}

.brand-intro h1 {
  margin: 0;
  color: var(--navy);
  font-family: var(--font-title);
  font-size: clamp(34px, 8vw, 52px);
  font-weight: 900;
  letter-spacing: -0.055em;
  text-shadow: 0 8px 24px rgba(16, 61, 93, 0.12);
}

.brand-intro p {
  margin: 10px 0 0;
  color: rgba(16, 61, 93, 0.8);
  font-size: 15px;
  font-weight: 700;
}

.menu-btn.primary,
.card.yellow,
.action-btn.primary {
  background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(190,225,255,0.8));
  border-color: rgba(16, 61, 93, 0.12);
}

.menu-btn,
.card,
.word-card,
.phrase-card,
.profile-card,
.history-card {
  box-shadow: 0 4px 14px rgba(28, 88, 115, 0.09);
  
}

.topbar-title {
  color: var(--white);
  text-shadow: none;
}


.menu-btn,
.card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;

  border: 1px solid rgba(17, 62, 96, 0.08);
  border-radius: 22px;
  padding: 14px 16px;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  text-align: left;
  text-decoration: none;
  color: var(--navy);
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 25px rgba(16, 61, 93, 0.08);
  font-family: var(--font);
}

.menu-btn:hover,
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 30px rgba(16, 61, 93, 0.12);
}

.menu-btn:active,
.card:active {
  transform: scale(0.98);
}

.menu-btn.primary {
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(195,229,255,0.82));
  border-color: rgba(16, 61, 93, 0.12);
}



.menu-emoji,
.card-icon {
  width: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  text-align: center;
}

.line-menu-icon {
  position: relative;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
}

.line-menu-icon::before,
.line-menu-icon::after {
  position: absolute;
  box-sizing: border-box;
  content: '';
}

.icon-message::before { inset: 4px 3px 7px; border: 2px solid var(--white); border-radius: 7px; }
.icon-message::after { bottom: 4px; left: 8px; width: 7px; height: 7px; border-bottom: 2px solid var(--white); border-left: 2px solid var(--white); transform: rotate(-45deg); }
.icon-favorite::before { inset: 0; color: var(--white); font-size: 31px; line-height: 28px; text-align: center; content: '☆'; }
.icon-library::before { top: 3px; left: 5px; width: 20px; height: 24px; border: 2px solid var(--white); border-radius: 3px; }
.icon-library::after { top: 9px; left: 10px; width: 10px; height: 2px; background: var(--white); box-shadow: 0 5px 0 var(--white), 0 10px 0 var(--white); }
.icon-settings::before { top: 7px; left: 7px; width: 16px; height: 16px; border: 2px solid var(--white); border-radius: 50%; box-shadow: 0 -6px 0 -4px var(--white), 0 6px 0 -4px var(--white), 6px 0 0 -4px var(--white), -6px 0 0 -4px var(--white); }
.icon-challenge::before { inset: 3px; border: 2px solid var(--white); border-radius: 50%; }
.icon-challenge::after { top: 12px; left: 12px; width: 6px; height: 6px; background: var(--white); border-radius: 50%; }

.profile-outline { position: relative; display: block; width: 20px; height: 20px; border: 2px solid var(--white); border-radius: 50%; }
.profile-outline::before, .profile-outline::after { position: absolute; left: 50%; box-sizing: border-box; content: ''; transform: translateX(-50%); }
.profile-outline::before { top: 3px; width: 6px; height: 6px; border: 1.5px solid var(--white); border-radius: 50%; }
.profile-outline::after { bottom: 2px; width: 11px; height: 6px; border: 1.5px solid var(--white); border-radius: 7px 7px 3px 3px; }

.app-line-icon {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: var(--white);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.menu-text,
.card-text {
  flex: 1;
}

.menu-title,
.card-text h3 {
  font-family: var(--font-title);
  font-size: 14px;
  line-height: 1.1;
  color: var(--white);
  font-weight: 800;
  margin: 0 0 2px;
}

.menu-sub,
.card-text p {
  font-size: 11px;
  line-height: 1.2;
  color: var(--navy-soft);
  font-weight: 600;
  margin: 0;
}

.menu-arrow,
.chevron {
  font-size: 20px;
  color: var(--navy-soft);
  margin-left: 6px;
}

.about-link {
  text-align: center;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 800;
  color: #ffffff;
  cursor: pointer;
  text-decoration: none;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}

.about-link:hover {
  text-decoration: underline;
}



.screen {
  width: 100%;
  padding: 4px 0 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.section-label {
  font-family: var(--font-title);
  font-size: 14px;
  font-weight: 800;
  color: var(--white);
  margin: 4px 0 10px;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
}

.favorites-screen {
  overflow-x: visible;
}

.favorites-heading {
  margin-top: 8px;
  margin-bottom: 12px;
}

.favorites-heading-words {
  margin-top: 24px;
}



.phrase-bar {
  width: 100%;
  background: #ffffff;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  min-height: 60px;
  height: auto;
  padding: 8px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  align-content: center;
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 16px;
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.08);
}

.phrase-chip {
 
 
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  line-height: 1;
  font-weight: 800;
  white-space: nowrap;

}
.phrase-chip span{
  color: #092B3B;
}

.phrase-placeholder {
  color: #123b4d6c;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.3;
}


.layer-label {
  text-align: center;
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 13px;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

.carousel-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 18px;
  min-height: 190px;
}

.input-mode-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: min(100%, 720px);
  margin: 18px auto 20px;
}

.input-mode-tab {
  min-height: 76px;
  border: 3px solid rgba(255, 255, 255, 0.8);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.78);
  color: var(--navy);
  font: 800 clamp(17px, 3vw, 24px) var(--font);
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
}

.input-mode-tab:hover { transform: translateY(-1px); }
.input-mode-tab:active { transform: scale(0.98); }
.input-mode-tab.active {
  background: var(--yellow);
  border-color: var(--yellow-dark);
  box-shadow: 0 8px 18px rgba(23, 58, 94, 0.22);
}

.input-mode-placeholder {
  min-height: 190px;
  width: 100%;
  margin-bottom: 18px;
  border: 2px dashed rgba(255, 255, 255, 0.75);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.22);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  color: #ffffff;
}

.input-mode-placeholder-icon { font-size: 56px; line-height: 1; opacity: 0.9; }
.input-mode-placeholder strong { font-size: 17px; }
.input-mode-placeholder span { font-size: 12px; font-weight: 700; opacity: 0.9; }

.mode-choice-hint {
  margin: 0 auto 18px;
  text-align: center;
  color: rgba(255, 255, 255, 0.9);
  font-size: 13px;
  font-weight: 700;
}

.mode-choice-screen { min-height: 100vh; width: 100%; padding: 24px; display: flex; flex-direction: column; }
.mode-choice-back { align-self: flex-start; border: 0; border-radius: 999px; padding: 14px 20px; background: rgba(255,255,255,.94); color: var(--navy); font: 800 16px var(--font); cursor: pointer; }
.mode-choice-content { width: min(100%, 760px); margin: auto; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.mode-choice-content h1 { margin: 0 0 10px; color: #fff; font-size: clamp(28px,5vw,48px); text-shadow: 0 2px 5px rgba(23,58,94,.4); }
.mode-choice-button { width: min(100%, 680px); min-height: 120px; border: 4px solid rgba(255,255,255,.9); border-radius: 28px; background: #fff; color: var(--navy); font: 900 clamp(24px,5vw,42px) var(--font); box-shadow: 0 10px 24px rgba(23,58,94,.2); cursor: pointer; transition: transform .15s ease, background .15s ease; }
.mode-choice-button:hover { transform: scale(1.02); background: #fff4c9; }
.mode-choice-button:active { transform: scale(.98); }

.mode-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  min-height: 100vh;
  width: 100%;
  padding: 24px;
  background: #1b364a;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  overflow: auto;
}

.mode-screen-back {
  align-self: flex-start;
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--navy);
  font: 800 15px var(--font);
  cursor: pointer;
}

.mode-screen-content {
  margin: auto;
  width: min(100%, 760px);
  min-height: 360px;
  border: 2px solid rgba(255, 255, 255, 0.22);
  border-radius: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  background: #234b61;
}

.mode-screen-content .input-mode-placeholder-icon { font-size: 86px; }
.mode-screen-content h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); }
.mode-screen-content p { margin: 0; font-size: 16px; font-weight: 700; opacity: 0.9; }

.circular-keyboard-reserved { width: min(100%, 900px); min-height: 420px; margin: auto; border: 3px dashed #cfe9f7; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #fff; color: var(--navy); }
.circular-keyboard-reserved h1 { margin: 0; font-size: clamp(30px,5vw,52px); }
.circular-keyboard-reserved p { margin: 10px 0 0; color: var(--navy-soft); font-size: 16px; font-weight: 700; }

.carousel-full-screen { position: fixed; inset: 0; z-index: 100; overflow: auto; min-height: 100vh; padding: 18px 24px 28px; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(23,58,94,.3)), url('assets/imagens/imagem-adulto.png') center / cover no-repeat; }
.carousel-full-topbar { width: min(100%, 1100px); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.carousel-full-content { width: min(100%, 1020px); margin: 12px auto 0; }
.carousel-full-content .section-label, .carousel-full-content .layer-label { color: #fff; }
.carousel-full-content .phrase-bar { margin-bottom: 18px; }
.carousel-full-content .carousel-wrap { min-height: 250px; margin-bottom: 18px; }
.carousel-full-content .carousel-card.center { width: 170px; height: 190px; }
.carousel-full-content .carousel-card.side { width: 110px; height: 140px; }
.carousel-full-content .confirm-btn { margin-bottom: 14px; }

.carousel-track {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  overflow: visible;
}

.carousel-arrow {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  border: 1px solid #dca707;
  border-radius: 50%;
  background: transparent;
  color: white;
  font-size: 24px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.18);
  transition: transform 0.1s ease;
}

.carousel-arrow:active {
  transform: scale(0.9);
}

.carousel-arrow:disabled {
  opacity: 0.35;
  cursor: default;
}

.carousel-card {
  flex: 0 0 auto;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition:
    transform 0.18s ease,
    opacity 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease;
  backdrop-filter: blur(4px);
  user-select: none;
}

.carousel-card.side {
  width: 78px;
  height: 110px;
  opacity: 0.55;
  transform: scale(0.82);
}

.carousel-card.side .emoji {
  font-size: 26px;
}

.carousel-card.side .label {
  font-size: 11px;
}

.carousel-card.center {
  width: 120px;
  height: 150px;
  opacity: 1;
  transform: scale(1);
  border-color: var(--yellow-dark);
  background: var(--yellow);
  box-shadow: 0 6px 16px rgba(23, 58, 94, 0.25);
}

.carousel-card.center .emoji {
  font-size: 42px;
}

.carousel-card.center .label {
  font-size: 15px;
}

.carousel-card .emoji {
  line-height: 1;
}

.carousel-card .label {
  font-family: var(--font-title);
  font-weight: 800;
  text-align: center;
  color: var(--white);
  padding: 0 4px;
}

.carousel-card:hover {
  transform: scale(0.9);
}

.carousel-card.center:hover {
  transform: scale(1.04);
}

.carousel-card.empty {
  visibility: hidden;
}


.confirm-btn {
  width: 100%;
  background: var(--yellow);
  color: #ffffff;
  border: none;
  border-radius: 16px;
  padding: 14px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 10px;
 border: 1px solid #ae8100;
  transition: transform 0.1s ease, opacity 0.15s ease;
}

.confirm-btn:active {
  transform: scale(0.98);
}

.confirm-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}


.action-row {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
 
}

.action-row button {
  flex: 1;
  min-width: 0;
  border:1px solid var(--card-border);
  background: transparent;
  color: white;
  border-radius: 12px;
  padding: 10px 6px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.1s ease;
}

@media (max-width: 560px) {
  .action-row button {
    flex: 1 1 calc(50% - 5px);
  }

  .action-row .btn-speak,
  .action-row .btn-fav {
    flex-basis: calc(33.333% - 7px);
  }
}

.action-row button:active {
  transform: scale(0.96);
}



.word-card {
  position: relative;
}

.favorite-toggle {
  position: absolute;
  top: 6px;
  right: 6px;
  border: 0;
  background: transparent;
  color: var(--navy);
  font-size: 18px;
  line-height: 1;
  padding: 2px;
  cursor: pointer;
}

.favorite-toggle.is-favorite {
  color: var(--yellow-dark);
}

#feedbackText::placeholder {
  color: #ffffff !important;
  opacity: 0.78 !important;
}

.word-favorite-remove {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 2;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  color: #c0392b;
  font-size: 15px;
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.speak-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--navy);
  color: #ffffff;
  border: none;
  border-radius: 16px;
  padding: 14px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 17px;
  cursor: pointer;
  margin-bottom: 14px;
  box-shadow: 0 4px 10px rgba(76, 175, 125, 0.35);
  transition: transform 0.1s ease, opacity 0.15s ease;
}

.speak-btn:active {
  transform: scale(0.98);
}

.speak-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.hint {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  margin-top: auto;
  padding-top: 10px;
}



.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 6px;
  cursor: pointer;
  font-size: 14px;
  width: max-content;
  padding: 5px;
  border-radius: 20px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}

.back-link:hover {
  text-decoration: underline;
}

.cat-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.cat-card {
  background: transparent;
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.1);
  backdrop-filter: blur(4px);
  transition: transform 0.1s ease;
}

.cat-card:hover {
  transform: translateY(-2px);
}

.cat-card:active {
  transform: scale(0.97);
}

.cat-card .emoji {
  font-size: 34px;
  display: block;
  margin-bottom: 6px;
}

.cat-card .label {
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 14px;
  color: var(--white);
}

.cat-card .count {
  font-size: 11.5px;
  color: var(--navy-soft);
  font-weight: 600;
}



.word-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}

.word-card {
  min-height: 150px;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  cursor: pointer;
  font-family: var(--font);
  box-shadow: 0 3px 8px rgba(23, 58, 94, 0.1);
  backdrop-filter: blur(4px);
  transition:
    transform 0.1s ease,
    background 0.1s ease;
}

.word-card:hover {
  transform: translateY(-2px);
}

.word-card:active {
  transform: scale(0.95);
}

.word-card .emoji {
  font-size: 30px;
  line-height: 1;
}

.word-card .label {
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 14px;
  text-align: center;
  color: var(--white);
}

.word-card .description {
  font-size: 10px;
  color: var(--navy-soft);
  text-align: center;
  line-height: 1.15;
  padding: 0 4px;
}

.word-card.selected {
  background: var(--yellow);
  border-color: var(--yellow-dark);
}

.word-card::after {
  content: '☆';
  font-size: 18px;
  color: var(--navy);
  margin-top: 2px;
}



.fav-item {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 12px rgba(16, 61, 93, 0.12);
}

.fav-item .txt {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  color: var(--white);
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.fav-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.fav-item button {
  background: var(--yellow);
  border: none;
  border-radius: 10px;
  padding: 8px 10px;
  font-weight: 800;
  cursor: pointer;
  color: var(--navy);
}

.fav-speak {
  min-width: 58px;
}

.fav-remove {
  background: none !important;
  color: var(--red) !important;
  font-size: 16px;
  min-width: 34px;
  min-height: 34px;
  padding: 6px !important;
}

.empty-state {
  text-align: center;
  color: #ffffff;
  font-weight: 700;
  padding: 40px 20px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}



.form-block {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
  backdrop-filter: blur(4px);
}

.form-block h3 {
  margin: 0 0 10px;
  font-family: var(--font-title);
  font-size: 15px;
  font-weight: 800;
  color: var(--white);
}

.form-row {
  width: 100%;
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.form-row input,
.form-row select {
  min-width: 0;
  flex: 1;
  border: 2px solid var(--card-border);
  border-radius: 10px;
  padding: 10px;
  font-family: var(--font);
  font-weight: 600;
  font-size: 14px;
  color: var(--white);
  background: #ffffff;
}

.form-row input:focus,
.form-row select:focus {
  outline: none;
  border-color: var(--yellow-dark);
}

.emoji-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.emoji-pick {
  font-size: 22px;
  background: #ffffff;
  border: 2px solid var(--card-border);
  border-radius: 10px;
  padding: 6px 8px;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.emoji-pick:hover {
  transform: scale(1.05);
}

.emoji-pick.chosen {
  border-color: var(--yellow-dark);
  background: var(--sky-top);
}

.submit-btn {
  width: 100%;
  background: var(--navy);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  padding: 12px;
  font-family: var(--font);
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.submit-btn:active {
  transform: scale(0.98);
}

.custom-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.custom-chip {
  background: #ffffff;
  border: 1.5px solid var(--card-border);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.custom-chip .x {
  appearance: none;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--red);
  cursor: pointer;
  font: inherit;
  font-weight: 900;
  line-height: 1;
  min-width: 44px;
  min-height: 44px;
  padding: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.custom-chip .x:hover,
.custom-chip .x:focus-visible {
  background: #ffe5e5;
  color: #a6261d;
}



.challenge-card {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
  backdrop-filter: blur(4px);
}

.challenge-card .emoji {
  font-size: 44px;
  line-height: 1;
}

.challenge-card p {
  font-weight: 700;
  font-size: 16px;
  color:white;
  margin-bottom: 0;
}

.stars {
  text-align: center;
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 18px;
  margin-bottom: 10px;
  color: var(--yellow);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}



.info-block {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  font-weight: 600;
  line-height: 1.5;
  font-size: 14px;
  color: var(--navy);
  backdrop-filter: blur(4px);
}

.profile-stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--card-border);
  font-weight: 700;
  color: var(--white);
}


.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: #ffffff;
  padding: 12px 20px;
  border-radius: 14px;
  font-weight: 700;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  z-index: 50;
  opacity: 0;
  transition: opacity 0.25s ease;
  max-width: 90%;
  text-align: center;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
}

body[data-theme="dark"] .toast {
  background: #10283d !important;
  color: #f1f7ff !important;
  border: 2px solid #8ddff0 !important;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .45) !important;
}


@media (max-width: 420px) {

  #app,
  .app {
    padding: 12px;
  }

  .word-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .word-card {
    min-height: 140px;
    padding: 10px 4px;
  }

  .word-card .emoji {
    font-size: 27px;
  }

  .word-card .label {
    font-size: 12px;
  }

  .word-card .description {
    font-size: 9px;
  }

  .action-row {
    gap: 7px;
  }

  .action-row button {
    font-size: 12px;
    padding: 10px 4px;
  }

  .carousel-card.center {
    width: 108px;
    height: 138px;
  }

  .carousel-card.center .emoji {
    font-size: 36px;
  }

  .carousel-card.side {
    width: 68px;
    height: 98px;
  }

  .carousel-card.side .emoji {
    font-size: 23px;
  }

  .carousel-card.side .label {
    font-size: 10px;
  }

  .carousel-arrow {
    width: 36px;
    height: 36px;
  }
}

@media (max-width: 350px) {

  .word-card {
    min-height: 130px;
  }

  .word-card .emoji {
    font-size: 25px;
  }

  .word-card .label {
    font-size: 11px;
  }

  .phrase-bar {
    min-height: 56px;
    padding: 7px 10px;
  }

  .carousel-card.center {
    width: 96px;
    height: 128px;
  }

  .carousel-card.side {
    width: 60px;
    height: 90px;
  }

  .carousel-track {
    gap: 5px;
  }

  .carousel-wrap {
    gap: 4px;
  }
}



@media (min-width: 600px) {
  .home-screen {
    padding-top: clamp(48px, 8vh, 100px);
  }

  .topbar-title {
    font-size: 22px;
  }

  .menu {
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
    gap: 14px;
  }

  .menu-btn {
    padding: 16px 20px;
  }

  .menu-title {
    font-size: 17px;
  }

  .menu-sub {
    font-size: 13px;
  }

  .cat-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .word-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .word-card {
    min-height: 160px;
  }

  .screen {
    max-width: 820px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }
}

@media (min-width: 900px) {
  .word-grid {
    grid-template-columns: repeat(5, 1fr);
  }
}

/* Acabamento da identidade: fundo azul-claro, superfícies brancas e relevo suave. */
.icon-btn,
.profile-btn,
.menu-btn,
.card,
.word-card,
.phrase-card,
.category-card,
.profile-card,
.history-card,
.action-btn {
  box-shadow: 0 8px 20px rgba(28, 88, 115, 0.16);
}

.menu-btn.primary,
.card.yellow,
.action-btn.primary {
  color: var(--white);
  box-shadow: 0 10px 22px rgba(174, 129, 0, 0.22);
}



#app input,
#app select,
#app textarea,
#app .word-card,
#app .phrase-card,
#app .category-card,
#app .profile-card,
#app .history-card {
  background: #123b4d;
  border-color: rgba(212, 234, 251, 0.32);
}

#app .icon-btn,
#app .profile-btn {
  background: #123b4d;
  border: 1px solid rgba(212, 234, 251, 0.5);
}

#app :is(button, [role="button"], input, select, textarea):focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 3px;
}


/* ===== Layout Infantil ===== */
/* Ativado quando STATE.data.profile.layout === 'infantil'
   (automaticamente ao salvar idade de 0 a 14 anos, ou
   manualmente pelo botão na página de perfil). Deixa a
   interface maior, mais colorida e mais arredondada. */

body.layout-infantil {
  --radius: 22px;
  --yellow: #ffb703;
  --yellow-dark: #d98c00;
  --card: #1f5c78;
}

body.layout-infantil .menu-btn,
body.layout-infantil .card,
body.layout-infantil .word-card,
body.layout-infantil .cat-card,
body.layout-infantil .form-block,
body.layout-infantil .info-block,
body.layout-infantil .challenge-card,
body.layout-infantil .fav-item {
  border-width: 3px;
  border-radius: 22px;
}

body.layout-infantil .topbar-title {
  font-size: 21px;
}

body.layout-infantil .icon-btn,
body.layout-infantil .profile-btn {
  width: 52px;
  height: 52px;
  font-size: 24px;
}

body.layout-infantil .menu-title,
body.layout-infantil .card-text h3 {
  font-size: 16px;
}

body.layout-infantil .menu-sub,
body.layout-infantil .card-text p {
  font-size: 12.5px;
}

body.layout-infantil .word-card .emoji,
body.layout-infantil .cat-card .emoji {
  font-size: 40px;
}

body.layout-infantil .word-card .label,
body.layout-infantil .cat-card .label {
  font-size: 16px;
}

body.layout-infantil .carousel-card.center .emoji {
  font-size: 54px;
}

body.layout-infantil .carousel-card.center .label {
  font-size: 17px;
}

body.layout-infantil .carousel-card.side .emoji {
  font-size: 32px;
}

body.layout-infantil .challenge-card .emoji {
  font-size: 54px;
}

body.layout-infantil .speak-btn,
body.layout-infantil .submit-btn,
body.layout-infantil .confirm-btn {
  border-radius: 24px;
  font-size: 19px;
  padding: 16px;
}

body.layout-infantil .action-row button {
  border-radius: 16px;
  font-size: 14px;
  padding: 12px 6px;
}

body.layout-infantil .stars {
  font-size: 21px;
}


/* ===== Onboarding (login + escolha de perfil) ===== */

.onboard-wrap {
  width: 100%;
  display: flex;
  flex-direction: column;
  padding-top: 30px;
}

.onboard-title {
  font-family: var(--font-title);
  font-size: 30px;
  font-weight: 800;
  color: #ffffff;
  text-align: center;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  margin-bottom: 6px;
}

.onboard-subtitle {
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.85);
  margin-bottom: 22px;
}

.onboard-panel {
  width: 100%;
  background: rgba(255, 255, 255, 0.04);
  border: 1.5px solid var(--card-border);
  border-radius: 22px;
  padding: 20px 16px;
  backdrop-filter: blur(4px);
}

.onboard-panel h2 {
  text-align: center;
  font-family: var(--font-title);
  font-size: 19px;
  font-weight: 800;
  color: #ffffff;
  margin: 0 0 6px;
}

.onboard-panel > p {
  text-align: center;
  font-size: 12.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.75);
  margin: 0 0 18px;
  line-height: 1.4;
}

.profile-choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.profile-choice-card {
  border-radius: 16px;
  padding: 10px;
  border: 2px solid transparent;
  cursor: pointer;
  text-align: left;
  transition:
    transform 0.1s ease,
    border-color 0.15s ease;
}

.profile-choice-card:hover {
  transform: translateY(-2px);
}

.profile-choice-card:active {
  transform: scale(0.97);
}

.profile-choice-card.kids {
  background: linear-gradient(180deg, #ffe08a, var(--yellow));
}

.profile-choice-card.adult {
  background: #dfeeff;
}

.profile-choice-card.selected {
  border-color: #ffffff;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
}

.profile-choice-card .emoji {
  font-size: 22px;
  line-height: 1;
  margin-bottom: 8px;
}

.profile-choice-card .tag {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--navy);
  opacity: 0.65;
  margin-bottom: 4px;
}

.profile-choice-card .title {
  font-family: var(--font-title);
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 4px;
  line-height: 1.15;
}

.profile-choice-card .desc {
  font-size: 10px;
  font-weight: 600;
  color: var(--navy);
  opacity: 0.85;
  line-height: 1.3;
  margin-bottom: 7px;
}

.profile-choice-card .foot {
  font-size: 9.5px;
  font-weight: 800;
  color: var(--navy);
  opacity: 0.7;
}

.onboard-continue-bar {
  width: 100%;
  text-align: center;
  padding: 13px;
  border: none;
  border-radius: 14px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 12.5px;
  margin-top: 4px;
  background: rgba(155, 140, 40, 0.5);
  color: rgba(255, 255, 255, 0.65);
  cursor: not-allowed;
}

.onboard-continue-bar.enabled {
  background: var(--navy);
  color: #ffffff;
  cursor: pointer;
}

.onboard-continue-bar:disabled {
  opacity: 1;
}

.onboard-hint {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.6);
  margin-top: 12px;
}

/* ---------- Tela de abertura do aplicativo ---------- */
.splash-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  opacity: 1;
  transition: opacity 0.7s ease;
  cursor: pointer;
  touch-action: manipulation;
}
.senior-splash-screen {
  flex-direction: column;
  gap: 0;
  background: #1b364a;
}
body[data-theme="light"] .senior-splash-screen {
  background: #eaf4fb;
}
body[data-theme="light"] .senior-splash-screen .splash-welcome {
  color: #123b4d;
  text-shadow: none;
}
body[data-theme="light"] .senior-splash-screen .splash-hint {
  color: #456678;
  text-shadow: none;
}
body[data-theme="dark"] .senior-splash-screen {
  background: #1b364a;
}
body[data-theme="dark"] .senior-splash-screen .splash-welcome {
  color: #eff7ff;
}
body[data-theme="dark"] .senior-splash-screen .splash-hint {
  color: #d4eafb;
}
.senior-splash-screen:focus-visible {
  outline: 4px solid #f7c94d;
  outline-offset: -10px;
}
.splash-screen.splash-hidden {
  opacity: 0;
  pointer-events: none;
  display: none;
}
.splash-logo {
  width: min(72vw, 300px);
  height: auto;
  object-fit: contain;
  animation: splashLogoIn 0.9s ease-out both;
}
.splash-enter {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  touch-action: manipulation;
}
.splash-welcome {
  margin-top: 18px;
  text-align: center;
  color: #ffffff;
  font-family: 'Nunito', var(--font-title);
  font-size: clamp(32px, 9vw, 42px);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.035em;
  text-shadow: 0 3px 14px rgba(0, 0, 0, 0.22);
  opacity: 0;
  animation: splashFadeUp 0.8s ease-out 0.1s both;
}
.splash-hint {
  margin-top: 10px;
  text-align: center;
  color: #d4eafb;

.switch {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  width: 54px;
  height: 32px;
  cursor: pointer;
}

.switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.switch-track {
  position: relative;
  width: 54px;
  height: 32px;
  border: 2px solid #6f91a8;
  border-radius: 999px;
  background: #345a74;
  transition: background .15s ease, border-color .15s ease;
}

.switch-track::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .15s ease;
}

.switch input:checked + .switch-track {
  background: #dca707;
  border-color: #ae8100;
}

.switch input:checked + .switch-track::after {
  transform: translateX(22px);
}

const SETTINGS_DEFAULTS = {

};

function getSettings() {
  const current = STATE.data.settings && typeof STATE.data.settings === 'object'
    ? STATE.data.settings
    : {};

  STATE.data.settings = {
    ...SETTINGS_DEFAULTS,
    ...current
  };

  return STATE.data.settings;
}

function applyAccessibilityTheme() {
  const settings = getSettings();
  const scales = [0.9, 1, 1.15, 1.35];
  const fontStep = Math.min(4, Math.max(1, Number(settings.fontStep) || 2));

  document.documentElement.style.setProperty(
    '--a11y-scale',
    scales[fontStep - 1]
  );
  document.body.dataset.theme = settings.darkTheme === false ? 'light' : 'dark';
}

let scanTimer = null;
let scanIndex = -1;
let scanScreen = '';

function clearScanHighlight() {
  document.querySelectorAll('.scan-active').forEach(element => {
    element.classList.remove('scan-active');
  });
}

function scanTargets() {
  return [...document.querySelectorAll(
    '#app button:not([disabled]), #app [role="button"]:not([aria-disabled="true"]), #app input:not([disabled]), #app select:not([disabled]), #app textarea:not([disabled])'
  )].filter(element => {
    const rect = element.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0 && !element.closest('[hidden]');
  });
}

function scheduleScan() {
  clearTimeout(scanTimer);
  scanTimer = null;
  clearScanHighlight();

  const settings = getSettings();
  const app = document.getElementById('app');
  if (!settings.scanEnabled || app?.getAttribute('aria-hidden') === 'true') return;

  const targets = scanTargets();
  if (!targets.length) return;

  if (scanScreen !== STATE.screen) {
    scanScreen = STATE.screen;
    scanIndex = -1;
  }

  scanIndex = (scanIndex + 1) % targets.length;
  const target = targets[scanIndex];
  target.classList.add('scan-active');
  target.closest('.switch')?.classList.add('scan-active');
  target.focus({ preventScroll: true });

  const scanSpeed = Math.min(5000, Math.max(600, Number(settings.scanSpeed) || 1800));
  scanTimer = setTimeout(scheduleScan, scanSpeed);
}

function allWords() {

function loadData() {

  try {

    const raw = localStorage.getItem(STORAGE_KEY);

    if (raw) {

      const parsed = JSON.parse(raw);

      STATE.data = {

        ...STATE.data,

        ...parsed,

        profile: {
          ...STATE.data.profile,
          ...(parsed.profile || {})
        }

      };

    }

  } catch (error) {

    console.error(
      'Erro ao carregar os dados:',
      error
    );

  }

  const shouldGoToProfileSelection =
    localStorage.getItem(
      'comunica:goToProfileSelection'
    ) === '1';

  const isLogoutLoading =
    localStorage.getItem('comunica:logoutLoading') === '1';

  localStorage.removeItem('comunica:logoutLoading');

  window.autoDismissSplash =
    isLogoutLoading ||
    shouldGoToProfileSelection ||
    STATE.data.profile.onboarded;

  window.playLogoutMusic = isLogoutLoading;

  if (isLogoutLoading) {
    STATE.screen = 'login';

  } else if (shouldGoToProfileSelection) {

    STATE.screen = 'chooseProfile';

  } else if (!STATE.data.profile.onboarded) {

    STATE.screen = 'login';

  }

  loadLayer();

  render();

}

function saveData() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(STATE.data)
    );

  } catch (error) {

    console.error(
      'Erro ao salvar os dados:',
      error
    );

  }

}



function showToast(message) {

  const toast = document.getElementById('toast');

  if (!toast) return;

  toast.textContent = message;

  toast.classList.add('show');

  clearTimeout(STATE.toastTimer);

  STATE.toastTimer = setTimeout(() => {

    toast.classList.remove('show');

  }, 1800);

}

function showAccessibleConfirm(message, onConfirm) {
  document.querySelector('.confirm-dialog')?.remove();
  const dialog = document.createElement('div');
  dialog.className = 'confirm-dialog';
  dialog.setAttribute('role', 'alertdialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.innerHTML = `<div class="confirm-dialog-panel" role="document">
    <p class="confirm-dialog-message">${message}</p>
    <div class="confirm-dialog-actions">
      <button type="button" class="confirm-dialog-confirm">Confirmar</button>
      <button type="button" class="confirm-dialog-cancel">Cancelar</button>
    </div>
  </div>`;
  document.body.appendChild(dialog);
  const confirmButton = dialog.querySelector('.confirm-dialog-confirm');
  const cancelButton = dialog.querySelector('.confirm-dialog-cancel');
  const close = () => dialog.remove();
  confirmButton.addEventListener('click', () => { close(); onConfirm(); });
  cancelButton.addEventListener('click', close);
  dialog.addEventListener('keydown', event => {
    if (event.key === 'Escape') { event.preventDefault(); close(); return; }
    if (['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'].includes(event.key)) {
      event.preventDefault();
      (document.activeElement === confirmButton ? cancelButton : confirmButton).focus();
      return;
    }
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      document.activeElement?.click();
    }
  });
  confirmButton.focus();
}


let speechRequestId = 0;

function preferredPortugueseVoice() {
  const voices = window.speechSynthesis.getVoices();
  const normalizedVoices = voices.map(voice => ({
    voice,
    name: (voice.name || '').toLowerCase(),
    lang: (voice.lang || '').toLowerCase()
  }));

  // O nome da voz varia entre Chrome, Android e Windows, por isso há alternativas.
  return normalizedVoices.find(({ name, lang }) =>
    lang === 'pt-br' &&
    name.includes('google') &&
    (name.includes('portugu') || name.includes('brazil') || name.includes('brasil'))
  )?.voice ||
  normalizedVoices.find(({ name, lang }) => lang === 'pt-br' && name.includes('google'))?.voice ||
  normalizedVoices.find(({ lang }) => lang === 'pt-br')?.voice ||
  normalizedVoices.find(({ lang }) => lang.startsWith('pt'))?.voice;
}

function speak(text) {
  if (!('speechSynthesis' in window)) {
    showToast('A voz não é suportada neste navegador.');
    return;
  }

  if (!text) return;

  const requestId = ++speechRequestId;
  let speechStarted = false;
  const speakNow = () => {
    if (requestId !== speechRequestId || speechStarted) return;
    speechStarted = true;

    const settings = getSettings();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'pt-BR';
    utterance.rate = Math.min(1.2, Math.max(0.5, Number(settings.voiceRate) || 0.8));
    utterance.pitch = 1;

    const ptVoice = preferredPortugueseVoice();
    if (ptVoice) utterance.voice = ptVoice;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  };

  if (window.speechSynthesis.getVoices().length) {
    speakNow();
    return;
  }

  window.speechSynthesis.addEventListener('voiceschanged', speakNow, { once: true });
  setTimeout(speakNow, 250);
}

function currentLayerKey() {

  const last =
    STATE.phrase[
      STATE.phrase.length - 1
    ];

  return last
    ? last.id
    : '__start__';

}

function loadLayer() {

  const key =
    currentLayerKey();

  let suggestions =
    SUGGESTIONS[key] || [];

  

  const customWords =
    STATE.data.customWords
      .filter(word =>
        !suggestions.includes(word.id)
      )
      .map(word => word.id);

  const combined =
    suggestions.concat(customWords);

  STATE.options =
    combined.filter(
      id => wordById(id)
    );

  if (
    STATE.carouselIndex >=
    STATE.options.length
  ) {

    STATE.carouselIndex = 0;

  }

}

function moveCarousel(delta) {

  if (
    STATE.options.length === 0
  ) {

    return;

  }

  const total =
    STATE.options.length;

  STATE.carouselIndex =
    (
      STATE.carouselIndex +
      delta +
      total
    ) % total;

  render();

}

function confirmSelection() {

  if (
    STATE.options.length === 0
  ) {

    showToast(
      'Não há mais opções.'
    );

    return;

  }

  const id =
    STATE.options[
      STATE.carouselIndex
    ];

  const word =
    wordById(id);

  if (!word) return;

  STATE.phrase.push(word);

  if (STATE.phrase.length === 3) {
    setTimeout(() => {
      speak(currentPhraseText());
    }, 250);
  } else {
    speak(word.label);
  }

  STATE.carouselIndex = 0;

  loadLayer();

  render();

}

function speakPhrase() {

  const text =
    currentPhraseText();

  if (text) {

    const spokenWords =
      text.trim().split(/\s+/).filter(Boolean).length;

    STATE.data.profile.wordsUsed =
      (STATE.data.profile.wordsUsed || 0) + spokenWords;

    saveData();

    speak(text);

  }

}

function renderModeScreen(mode) {
  if (mode === 'circular') return renderCircularKeyboard();

function renderCarouselMode() {
  const chipHtml = STATE.phrase.length
    ? STATE.phrase.map(word => `<span class="phrase-chip">${word.emoji} ${word.label}</span>`).join('')
    : `<span class="phrase-placeholder">Escolha uma palavra no carrossel...</span>`;
  const n = STATE.options.length;
  let cardsHtml = '';

  if (n === 0) {
    cardsHtml = `<div class="carousel-empty">Você chegou ao fim da frase.<br><br>Toque em <strong>Limpar</strong> para começar novamente.</div>`;
  } else {
    const prevId = n > 1 ? STATE.options[(STATE.carouselIndex - 1 + n) % n] : null;
    const nextId = n > 1 ? STATE.options[(STATE.carouselIndex + 1) % n] : null;
    const curId = STATE.options[STATE.carouselIndex];
    const card = (id, type) => {
      if (!id) return `<div class="carousel-card ${type} empty"></div>`;
      const word = wordById(id);
      if (!word) return `<div class="carousel-card ${type} empty"></div>`;
      return `<div class="carousel-card ${type}" data-pick="${id}" role="button" tabindex="${type === 'center' ? '0' : '-1'}" aria-label="${word.label}"><div class="emoji">${word.emoji}</div><div class="label">${word.label}</div></div>`;
    };
    cardsHtml = `<button class="carousel-arrow" id="prevBtn" ${n < 2 ? 'disabled' : ''} aria-label="Palavra anterior">‹</button><div class="carousel-track">${card(prevId, 'side')}${card(curId, 'center')}${card(nextId, 'side')}</div><button class="carousel-arrow" id="nextBtn" ${n < 2 ? 'disabled' : ''} aria-label="Próxima palavra">›</button>`;
  }

  const layerLabel = STATE.phrase.length === 0 ? 'QUEM ESTÁ FALANDO?' : STATE.phrase.length === 1 ? 'O QUE VOCÊ QUER DIZER?' : 'COMPLETE A FRASE';
  return `<div class="carousel-full-screen"><div class="carousel-full-topbar"><button class="icon-btn" data-go="build" aria-label="Voltar para escolha do modo">←</button><div class="topbar-title">Comunicar</div><button class="icon-btn" data-go="personalize" aria-label="Personalizar">⚙︎</button></div><div class="carousel-full-content"><div class="section-label">MINHA FRASE</div><div class="phrase-bar" role="group" aria-label="Minha frase">${chipHtml}</div><div class="layer-label">${layerLabel}</div><div class="carousel-wrap">${cardsHtml}</div><button class="confirm-btn" id="confirmBtn" ${n === 0 ? 'disabled' : ''}>✓ Selecionar</button><div class="action-row"><button class="btn-erase" id="eraseBtn">Apagar</button><button class="btn-clear" id="clearBtn">Limpar</button><button class="btn-speak" id="speakBtn" ${STATE.phrase.length ? '' : 'disabled'}>Falar</button><button class="btn-fav" id="favPhraseBtn" ${STATE.phrase.length ? '' : 'disabled'}>Favorizar frase</button><button class="btn-fav-word" id="favWordBtn" ${STATE.phrase.length ? '' : 'disabled'}>Favoritar palavra</button></div><div class="back-link" data-go="categories" style="margin-top:4px;">Ver todas as categorias</div><div class="hint">← → navega · Enter/Espaço seleciona · toque também funciona</div></div></div>`;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderChallenge() {

  if (!STATE.challenge) {

    STATE.challenge =
      CHALLENGES[
        Math.floor(
          Math.random() *
          CHALLENGES.length
        )
      ];

    STATE.phrase = [];

  }

  const challenge =
    STATE.challenge;

  const done =
    STATE.phrase.length > 0 &&
    STATE.phrase
      .map(
        word => word.id
      )
      .join(',') ===
      challenge.target.join(',');

  const targetWords =
    allWords().filter(
      word =>
        challenge.target.includes(
          word.id
        )
    );

  const targetCategories =
    new Set(
      targetWords.map(
        word => word.cat
      )
    );

  const distractors =
    allWords()
      .filter(
        word =>
          targetCategories.has(
            word.cat
          ) &&
          !challenge.target.includes(
            word.id
          )
      )
      .slice(0, 5);

  let options =
    targetWords.concat(
      distractors
    );

  options =
    options.sort(
      () =>
        Math.random() - 0.5
    );

  return `

    <div class="topbar">

      <button
        class="icon-btn"
        data-go="home"
      >
        ←
      </button>

      <div class="topbar-title">
        Desafio

      <div style="width:44px"></div>

    </div>

      <div class="stars">
        
        ${STATE.data.profile.stars}
        estrelas
      </div>

        <div class="emoji">
          ${challenge.emoji}
        </div>

        <p>
          ${challenge.prompt}
        </p>

      </div>

      <div class="section-label">
        MINHA FRASE
      </div>

      <div class="phrase-bar">

        ${
          STATE.phrase.length

            ? STATE.phrase
                .map(
                  word => `

                    <span class="phrase-chip">
                      ${word.emoji}
                      ${word.label}
                    </span>

                  `
                )
                .join('')

            : `

              <span class="phrase-placeholder">
                Monte a frase certa...
              </span>

            `
        }

      </div>

      <div class="action-row">

        <button
          class="btn-erase"
          id="eraseBtn"
        >
          ⌫ Apagar
        </button>

        <button
          class="btn-clear"
          id="clearBtn"
        >
           Limpar
        </button>

      </div>

      <div class="section-label">
        MONTE A RESPOSTA
      </div>

      <div class="word-grid">

        ${options
          .map(
            word =>
              wordCardHtml(
                word,
                false
              )
          )
          .join('')}

      </div>

      ${
        done

          ? `

            <button
              class="speak-btn"
              id="challengeWinBtn"
            >
               Muito bem! Ganhar estrela
            </button>

          `

          : `

function renderSettings() {

  const voiceRate = Math.min(1.2, Math.max(0.5, Number(s.voiceRate) || 0.8));
  const voiceLabel = voiceRate <= 0.6 ? 'Muito lenta' : voiceRate <= 0.8 ? 'Lenta' : voiceRate <= 1 ? 'Normal' : 'Rápida';
  return `
    <div class="topbar settings-topbar">
      <button class="icon-btn" data-go="home" aria-label="Voltar para o início">←</button>
      <div class="topbar-title">Configurações</div>
      <div style="width:var(--tap-min)"></div>
    </div>
    <div class="screen">
      <div class="form-block settings-panel">
        <div class="settings-row"><div><div class="settings-label">Tamanho da letra e dos botões</div><div class="settings-desc">Deixa tudo maior ou menor na tela</div></div><div class="stepper"><button id="seniorFontDown" aria-label="Diminuir tamanho da letra">−</button><span aria-live="polite">${fontLabels[(s.fontStep || 2) - 1]}</span><button id="seniorFontUp" aria-label="Aumentar tamanho da letra">+</button></div></div>
        <div class="settings-row"><div><div class="settings-label">Tema escuro</div><div class="settings-desc">Fundo escuro e menos brilho para facilitar o uso</div></div><label class="switch"><input id="seniorDarkToggle" type="checkbox" ${s.darkTheme !== false ? 'checked' : ''}><span class="switch-track"></span></label></div>
        <div class="settings-row"><div><div class="settings-label">Modo de varredura</div><div class="settings-desc">O foco amarelo passa pelos controles. Pressione Enter, Espaço ou o centro do analógico para escolher o controle destacado.</div></div><label class="switch"><input id="seniorScanToggle" type="checkbox" ${s.scanEnabled ? 'checked' : ''}><span class="switch-track"></span></label></div>
        <div class="settings-row"><div><div class="settings-label">Velocidade da varredura</div><div class="settings-desc">Tempo em cada botão: ${(speed / 1000).toFixed(1)}s</div></div><div class="stepper"><button id="seniorScanSlow" aria-label="Deixar a varredura mais lenta">−</button><span aria-live="polite">${(speed / 1000).toFixed(1)}s</span><button id="seniorScanFast" aria-label="Deixar a varredura mais rápida">+</button></div></div>
        <div class="settings-row"><div><div class="settings-label">Velocidade da voz</div><div class="settings-desc">A voz lê a frase mais devagar ou mais depressa.</div></div><div class="stepper"><button id="seniorVoiceSlow" aria-label="Deixar a voz mais lenta">−</button><span aria-live="polite">${voiceLabel}</span><button id="seniorVoiceFast" aria-label="Deixar a voz mais rápida">+</button></div></div>
      </div>
    </div>`;
}

function updateAccessibilitySettings(changes) {
  const settings = getSettings();
  Object.assign(settings, changes);
  saveData();
  applyAccessibilityTheme();
  render();
}

function attachHandlers() {


  prepareKeyboardNavigation();

  if (fontUp) fontUp.addEventListener('click', () => updateAccessibilitySettings({ fontStep: Math.min(4, (settings.fontStep || 2) + 1) }));
  const darkToggle = document.getElementById('seniorDarkToggle');
  if (darkToggle) darkToggle.addEventListener('change', event => updateAccessibilitySettings({ darkTheme: event.target.checked }));
  const scanToggle = document.getElementById('seniorScanToggle');

  const scanSlow = document.getElementById('seniorScanSlow');

  if (scanSlow) scanSlow.addEventListener('click', () => updateAccessibilitySettings({ scanSpeed: Math.min(5000, (settings.scanSpeed || 1800) + 300) }));

document.addEventListener('keydown', event => {
  if (event.defaultPrevented || !['Backspace', 'Delete'].includes(event.key) || event.repeat) return;
  const active = document.activeElement;
  if (!active?.matches('[data-del-word], [data-del-cat], [data-remove-word], [data-remove-phrase]')) return;
  event.preventDefault();
  active.click();
});

function prepareKeyboardNavigation() {

  const selector = [
    'button:not([disabled])',
    '[data-go]',
    '[data-word]',
    '[data-category]',
    '[data-pick]',
    '[data-fav-word]',
    '[data-del-word]',
    '[data-del-cat]',
    '[data-profile-type]',
    '.emoji-pick'
  ].join(',');

  document.querySelectorAll(selector).forEach(element => {
    if (element.matches('button, input, select, textarea')) return;

    if (!element.hasAttribute('tabindex')) {
      element.setAttribute('tabindex', '0');
    }

    if (!element.hasAttribute('role')) {
      element.setAttribute('role', 'button');
    }
  });
}


function keyboardTargets() {

  const dialog = document.querySelector('.confirm-dialog');
  if (dialog) return [...dialog.querySelectorAll('button:not([disabled])')];

  const selector = [
    'button:not([disabled])',
    '[data-go]',
    '[data-word]',
    '[data-category]',
    '[data-pick]',
    '[data-fav-word]',
    '[data-del-word]',
    '[data-del-cat]',
    '[data-profile-type]',
    '.emoji-pick',
    'input:not([disabled])',
    'select:not([disabled])',
    'textarea:not([disabled])'
  ].join(',');

  return [...document.querySelectorAll(selector)].filter(element => {
    const rect = element.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0 && !element.closest('[hidden]');
  });
}


function moveKeyboardFocus(direction) {

  const targets = keyboardTargets();
  const current = document.activeElement;

  const markControlFocus = element => {
    document.querySelectorAll('.accessibility-focus').forEach(item => item.classList.remove('accessibility-focus'));
    element?.classList.add('accessibility-focus');
    element?.closest('.switch')?.classList.add('accessibility-focus');
  };

  if (!targets.length) return;

  if (!targets.includes(current)) {
    targets[0].focus();
    markControlFocus(targets[0]);
    return;
  }

  const index = targets.indexOf(current);

  if (index === -1) {
    targets[0].focus();
    markControlFocus(targets[0]);
    return;
  }

  const goingForward =
    direction === 'ArrowRight' ||
    direction === 'ArrowDown';

  const nextIndex =
    (
      index +
      (goingForward ? 1 : -1) +
      targets.length
    ) % targets.length;

  targets[nextIndex].focus();
  markControlFocus(targets[nextIndex]);

}


document.addEventListener('keydown', event => {

  const active = document.activeElement;
  const tag = active?.tagName;

  const isArrow =
    ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']
      .includes(event.key);

  if (tag === 'INPUT' || tag === 'TEXTAREA') {

    if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
      event.preventDefault();
      moveKeyboardFocus(event.key);
      return;
    }

    if (isArrow) {

      const atStart =
        active.selectionStart === 0 &&
        active.selectionEnd === 0;

      const atEnd =
        active.selectionStart === active.value.length &&
        active.selectionEnd === active.value.length;

      const canLeave =
        (event.key === 'ArrowLeft' && atStart) ||
        (event.key === 'ArrowRight' && atEnd);

      if (canLeave) {
        event.preventDefault();
        moveKeyboardFocus(event.key);
      }

      return;

    }

    return;

  }

  if (tag === 'SELECT') {

    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      moveKeyboardFocus(event.key);
    }

    return;

  }

  if (event.defaultPrevented) return;

  if (event.key === 'Escape') {
    event.preventDefault();
    if (STATE.screen !== 'home' && STATE.screen !== 'login' && STATE.screen !== 'chooseProfile') {
      go('home');
    } else {
      document.activeElement?.blur();
    }
    return;
  }

  if (isArrow) {
    event.preventDefault();
    moveKeyboardFocus(event.key);
    return;
  }

  if (
    (event.key === 'Enter' || event.key === ' ') &&
    document.activeElement?.matches('[role="button"]:not(button)')
  ) {
    event.preventDefault();
    document.activeElement.click();
  }
});



document.addEventListener(
  'keydown',
  event => {

    if (event.defaultPrevented) {
      return;
    }

    

    if (
      STATE.screen !== 'build'
    ) {

      return;

    }

   

    const tag =
      document.activeElement
        ?.tagName;

    if (
      tag === 'INPUT' ||
      tag === 'TEXTAREA' ||
      tag === 'SELECT'
    ) {

      return;

    }

    if (
      event.key === 'ArrowLeft'
    ) {

      event.preventDefault();

      moveCarousel(-1);

    }

    else if (
      event.key === 'ArrowRight'
    ) {

      event.preventDefault();

      moveCarousel(1);

    }

    else if (
      event.key === 'Enter' ||
      event.key === ' '
    ) {

      const focused =
        document.activeElement;

   
      if (
        focused &&
        focused.tagName === 'BUTTON'
      ) {

        return;

      }

      event.preventDefault();

      confirmSelection();

    }

    else if (
      event.key === 'Backspace'
    ) {

      event.preventDefault();

      eraseLast();

    }

    else if (
      event.key === 'Escape'
    ) {

      event.preventDefault();

      clearPhrase();

    }

  }
);

function initSeniorSplash() {
  const splash = document.getElementById('seniorSplashScreen');
  const app = document.getElementById('app');

  if (!splash || !app) return;

  let encerrado = true;

  const entrarNoAplicativo = () => {
    if (encerrado) return;
    encerrado = true;
    splash.classList.add('splash-hidden');
    app.removeAttribute('aria-hidden');

    setTimeout(() => {
      splash.style.display = 'none';
    }, 700);
  };

  window.showSeniorSplash = () => {
    encerrado = false;
    splash.style.display = 'flex';
    splash.classList.remove('splash-hidden');
    app.setAttribute('aria-hidden', 'true');
    splash.focus({ preventScroll: true });
    splash.addEventListener('pointerdown', entrarNoAplicativo, { once: true });
    splash.addEventListener('click', entrarNoAplicativo, { once: true });
    splash.addEventListener('touchend', entrarNoAplicativo, { once: true });
  };

  splash.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      entrarNoAplicativo();
    }
  });
}

function initInitialSplash() {
  const splash = document.getElementById('splashScreen');

  if (!splash) return;

  window.showLogoutSplash = () => {
    const app = document.getElementById('app');
    const musica = document.getElementById('appMusic');

    splash.style.display = 'flex';
    splash.classList.remove('splash-hidden');

    if (app) {
      app.setAttribute('aria-hidden', 'true');
    }

    if (musica) {
      musica.currentTime = 0;
      musica.volume = 0.35;
      musica.play().catch((erro) => {
        console.warn('O navegador bloqueou o autoplay:', erro);
      });
    }

    setTimeout(() => {
      splash.classList.add('splash-hidden');

      if (app) {
        app.removeAttribute('aria-hidden');
      }

      setTimeout(() => {
        splash.style.display = 'none';
      }, 700);
    }, 300);
  };

  if (!window.autoDismissSplash) return;

  setTimeout(() => {
    splash.classList.add('splash-hidden');
    setTimeout(() => {
      splash.style.display = 'none';
    }, 700);
  }, 300);
}

const FIRST_OPEN_MUSIC_KEY = 'comunica:firstOpenMusicPlayed:v4';

function iniciarMusicaUmaVez() {
  const musica = document.getElementById('appMusic');
  if (!musica) return;

  if (window.playLogoutMusic) {
    musica.removeAttribute('loop');
    musica.loop = false;
    musica.autoplay = true;
    musica.playsInline = true;
    musica.volume = 0.35;
    musica.play().catch((erro) => {
      console.warn('O navegador bloqueou o autoplay:', erro);
    });
    return;
  }

  if (window.autoDismissSplash) {
    musica.pause();
    return;
  }

  if (localStorage.getItem(FIRST_OPEN_MUSIC_KEY) === '1') {
    musica.pause();
    return;
  }

  musica.removeAttribute('loop');
  musica.loop = false;
  musica.autoplay = true;
  musica.playsInline = true;
  musica.volume = 0.35;
  musica.addEventListener('timeupdate', () => {
    if (musica.currentTime > 0.1) {
      localStorage.setItem(FIRST_OPEN_MUSIC_KEY, '1');
    }
  }, { once: true });

  const tocarMusica = () => musica.play()
    .catch((erro) => {
      console.warn('O navegador bloqueou o autoplay:', erro);
    });

  tocarMusica();
}

function pararMusica() {
  const musica = document.getElementById('appMusic');
  if (!musica) return;

  musica.removeAttribute('loop');
  musica.loop = false;
  musica.pause();
  musica.currentTime = 0;
}

/* Controle por joystick/gamepad: analógico navega, clique no analógico seleciona e B volta. */
function initGamepadControls() {
  if (!('getGamepads' in navigator)) return;
  let previous = [];
  let lastAxisMove = 0;

  const press = (pad, index) => Boolean(pad.buttons[index]?.pressed);
  const rising = (pad, index) => press(pad, index) && !previous[index];
  const markGamepadFocus = element => {
    document.querySelectorAll('.accessibility-focus').forEach(item => item.classList.remove('accessibility-focus'));
    element?.classList.add('accessibility-focus');
    element?.closest('.switch')?.classList.add('accessibility-focus');
  };

  const poll = timestamp => {
    const pad = [...(navigator.getGamepads?.() || [])].find(Boolean);
    if (pad) {
      if (rising(pad, 0) || rising(pad, 10)) {
        const seniorSplash = document.getElementById('seniorSplashScreen');
        const splashVisible = seniorSplash && !seniorSplash.classList.contains('splash-hidden')
          && seniorSplash.style.display !== 'none';
        if (splashVisible) {
          seniorSplash.click();
          previous = pad.buttons.map(button => Boolean(button.pressed));
          requestAnimationFrame(poll);
          return;
        }
        const active = document.activeElement;
        if (active && active !== document.body && typeof active.click === 'function') {
          markGamepadFocus(active);
          active.click();
        } else {
          const firstTarget = document.querySelector('#app button:not([disabled]), #app [role="button"]');
          firstTarget?.focus();
          markGamepadFocus(firstTarget);
        }
      }
      if (rising(pad, 1)) {
        const dialogCancel = document.querySelector('.confirm-dialog-cancel');
        if (dialogCancel) {
          dialogCancel.click();
        } else if (STATE.screen !== 'home' && STATE.screen !== 'login' && STATE.screen !== 'chooseProfile') {
          go('home');
        }
      }
      if (timestamp - lastAxisMove > 180) {
        const x = pad.axes[0] || 0;
        const y = pad.axes[1] || 0;
          const direction = Math.abs(x) > 0.4 ? (x > 0 ? 'ArrowRight' : 'ArrowLeft') : Math.abs(y) > 0.4 ? (y > 0 ? 'ArrowDown' : 'ArrowUp') : null;
        if (direction) {
          moveKeyboardFocus(direction);
          markGamepadFocus(document.activeElement);
          lastAxisMove = timestamp;
        }
      }
      previous = pad.buttons.map(button => Boolean(button.pressed));
    }
    requestAnimationFrame(poll);
  };

  requestAnimationFrame(poll);
}

loadData();
applyAccessibilityTheme();
initSeniorSplash();
initInitialSplash();
iniciarMusicaUmaVez();
initGamepadControls();
