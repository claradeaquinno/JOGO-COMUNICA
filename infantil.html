/* ---------- Handlers ---------- */
function activateOnEnterSpace(handler) {
  return event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      handler(event);
    }
  };
}

/* =========================================================
   Teclado circular alfabético da aba Personalizar
   Mesmo comportamento do teclado circular: setor (cunha) amarelo na
   letra em foco, setas ← → giram pelas letras, e o menu orbital
   (limpar / excluir / voltar / salvar) acompanha a letra ativa.
   ========================================================= */
let personalizeKeyboardRefresh = null;
let personalizeKeyboardResizeFrame = 0;

window.addEventListener('resize', () => {
  cancelAnimationFrame(personalizeKeyboardResizeFrame);
  personalizeKeyboardResizeFrame = requestAnimationFrame(() => {
    if (personalizeKeyboardRefresh) personalizeKeyboardRefresh();
  });
});

function initPersonalizeKeyboard() {
  const stage = document.querySelector('.personalize-keyboard-stage');
  const anel = document.getElementById('personalizeAnel');
  const cunha = document.getElementById('personalizeCunha');
  const teclado = document.getElementById('personalizeTeclado');
  const menu = document.getElementById('personalizeMenuOrbital');
  const input = document.getElementById('newWordLabel');
  personalizeKeyboardRefresh = null;
  if (!stage || !anel || !cunha || !teclado || !menu) return;

  const teclas = [...anel.querySelectorAll('[data-personalize-letter]')];
  const botoes = [...menu.querySelectorAll('.satelite')];
  if (!teclas.length || !botoes.length) return;

  let indiceAtivo = 0;
  let direcaoAtiva = teclas[0].dataset.direcao || 'cima';

  // Teclas do anel nunca podem se sobrepor: o tamanho acompanha o espaço
  // entre letras vizinhas (importante em telas estreitas).
  function ajustarTamanhoDasTeclas() {
    const largura = anel.getBoundingClientRect().width;
    if (!largura) return;
    const passo = (2 * Math.PI * largura * 0.36) / teclas.length;
    const tamanho = Math.max(20, Math.min(32, Math.floor(passo)));
    teclas.forEach(tecla => {
      tecla.style.width = `${tamanho}px`;
      tecla.style.height = `${tamanho}px`;
    });
  }

  // Mesma trigonometria do menu orbital do teclado circular: arco de
  // botões centrado na direção da letra ativa, com raio limitado para
  // nunca sair da área do teclado.
  function posicionarMenu() {
    const area = menu.getBoundingClientRect();
    const tecladoRect = teclado.getBoundingClientRect();
    if (!area.width || !area.height || !tecladoRect.width || !tecladoRect.height) return;

    const centroX = tecladoRect.left + tecladoRect.width / 2 - area.left;
    const centroY = tecladoRect.top + tecladoRect.height / 2 - area.top;
    const raioDesejado = tecladoRect.width * 0.43;
    const anguloBase = ANGULO_BASE_MENU[direcaoAtiva] ?? 0;
    const total = botoes.length;
    const arco = Math.min(ARCO_MENU_GRAUS, (total - 1) * 24);

    const angulos = botoes.map((_, indice) => {
      const deslocamento = total > 1 ? (indice - (total - 1) / 2) * (arco / (total - 1)) : 0;
      return anguloBase + deslocamento;
    });

    const raioSeguro = botoes.reduce((limite, botao, indice) => {
      const rad = angulos[indice] * Math.PI / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const metadeLargura = (botao.offsetWidth || 54) / 2;
      const metadeAltura = (botao.offsetHeight || 54) / 2;
      let limiteBotao = Infinity;
      if (cos > 0.001) limiteBotao = Math.min(limiteBotao, (area.width - metadeLargura - 4 - centroX) / cos);
      else if (cos < -0.001) limiteBotao = Math.min(limiteBotao, (centroX - metadeLargura - 4) / -cos);
      if (sin > 0.001) limiteBotao = Math.min(limiteBotao, (area.height - metadeAltura - 4 - centroY) / sin);
      else if (sin < -0.001) limiteBotao = Math.min(limiteBotao, (centroY - metadeAltura - 4) / -sin);
      return Math.min(limite, limiteBotao);
    }, Infinity);
    const raio = Math.max(0, Math.min(raioDesejado, raioSeguro));

    botoes.forEach((botao, indice) => {
      const rad = angulos[indice] * Math.PI / 180;
      botao.style.left = `${centroX + Math.cos(rad) * raio}px`;
      botao.style.top = `${centroY + Math.sin(rad) * raio}px`;
      botao.dataset.angulo = String(angulos[indice]);
    });
  }

  function mostrarCunha(indice) {
    const abertura = 360 / teclas.length;
    const inicio = indice * abertura - abertura / 2;
    cunha.style.background = `conic-gradient(from ${inicio}deg, rgb(255 230 140 / 75%) 0deg ${abertura}deg, transparent ${abertura}deg 360deg)`;
    cunha.classList.add('ativa');
  }

  function selecionarTecla(indice) {
    indiceAtivo = ((indice % teclas.length) + teclas.length) % teclas.length;
    const tecla = teclas[indiceAtivo];
    teclas.forEach(item => { item.tabIndex = item === tecla ? 0 : -1; });
    direcaoAtiva = tecla.dataset.direcao || 'cima';
    menu.classList.add('ativo');
    mostrarCunha(indiceAtivo);
    posicionarMenu();
  }

  function focarTecla(indice) {
    selecionarTecla(indice);
    teclas[indiceAtivo].focus({ preventScroll: true });
  }

  function inserirLetra(letra) {
    if (!input) return;
    const inicio = input.selectionStart ?? input.value.length;
    const fim = input.selectionEnd ?? inicio;
    input.setRangeText(letra, inicio, fim, 'end');
  }

  teclas.forEach((tecla, indice) => {
    tecla.addEventListener('focus', () => selecionarTecla(indice));
    tecla.addEventListener('click', () => {
      // Safari não foca botões ao clicar; selecionamos manualmente para o
      // setor e o menu orbital acompanharem a letra tocada.
      focarTecla(indice);
      inserirLetra(tecla.getAttribute('data-personalize-letter') || '');
    });
  });

  // O setor amarelo só aparece enquanto o foco está no teclado.
  stage.addEventListener('focusout', evento => {
    if (!stage.contains(evento.relatedTarget)) cunha.classList.remove('ativa');
  });

  function botaoMaisProximoDaTecla() {
    const anguloTecla = (indiceAtivo / teclas.length) * 360 - 90;
    let melhor = 0;
    let menorDistancia = Infinity;
    botoes.forEach((botao, indice) => {
      const diferenca = (Number(botao.dataset.angulo) - anguloTecla) * Math.PI / 180;
      const distancia = Math.abs(Math.atan2(Math.sin(diferenca), Math.cos(diferenca)));
      if (distancia < menorDistancia) {
        menorDistancia = distancia;
        melhor = indice;
      }
    });
    return botoes[melhor];
  }

  // Setas: ← → giram pelas letras; ↑ ↓ entram no menu orbital; no menu,
  // ← → percorrem os botões e ↑ ↓ (ou Esc) devolvem o foco à letra ativa.
  // stopPropagation impede os atalhos globais de mover o foco para fora.
  stage.addEventListener('keydown', evento => {
    const indiceTecla = teclas.indexOf(evento.target);
    const indiceBotao = botoes.indexOf(evento.target);

    if (indiceTecla >= 0) {
      if (evento.key === 'ArrowRight') focarTecla(indiceTecla + 1);
      else if (evento.key === 'ArrowLeft') focarTecla(indiceTecla - 1);
      else if (evento.key === 'ArrowUp' || evento.key === 'ArrowDown') botaoMaisProximoDaTecla().focus({ preventScroll: true });
      else return;
      evento.preventDefault();
      evento.stopPropagation();
      return;
    }

    if (indiceBotao >= 0) {
      let proximo = null;
      if (evento.key === 'ArrowRight') proximo = botoes[(indiceBotao + 1) % botoes.length];
      else if (evento.key === 'ArrowLeft') proximo = botoes[(indiceBotao - 1 + botoes.length) % botoes.length];
      else if (evento.key === 'ArrowUp' || evento.key === 'ArrowDown' || evento.key === 'Escape') proximo = teclas[indiceAtivo];
      else return;
      evento.preventDefault();
      evento.stopPropagation();
      proximo.focus({ preventScroll: true });
    }
  });

  // ↓ no campo de texto leva o foco direto para a letra ativa do teclado.
  if (input) input.addEventListener('keydown', evento => {
    if (evento.key !== 'ArrowDown') return;
    evento.preventDefault();
    evento.stopPropagation();
    focarTecla(indiceAtivo);
  });

  personalizeKeyboardRefresh = () => {
    if (!stage.isConnected) return;
    ajustarTamanhoDasTeclas();
    posicionarMenu();
  };

  ajustarTamanhoDasTeclas();
  posicionarMenu();
  requestAnimationFrame(personalizeKeyboardRefresh);

  const limpar = document.getElementById('personalizeClearBtn');
  if (limpar) limpar.addEventListener('click', () => {
    if (input) input.value = '';
  });

  const excluir = document.getElementById('personalizeDeleteBtn');
  if (excluir) excluir.addEventListener('click', () => {
    if (!input) return;
    const inicio = input.selectionStart ?? input.value.length;
    const fim = input.selectionEnd ?? inicio;
    if (inicio !== fim) input.setRangeText('', inicio, fim, 'end');
    else if (inicio > 0) input.setRangeText('', inicio - 1, inicio, 'end');
  });
}

function attachHandlers() {

  document.querySelectorAll('[data-mode-screen]').forEach(element => {
    const activate = () => {
      const target = element.getAttribute('data-mode-screen');
      const modeTexts = {
        circularMode: 'Teclado circular',
        carouselMode: 'Carrossel'
      };
      if (modeTexts[target]) playMenuVoice(target, modeTexts[target]);
      go(target);
    };
    element.addEventListener('click', activate);
    element.addEventListener('keydown', activateOnEnterSpace(activate));
  });

  document.querySelectorAll('[data-go]').forEach(element => {
    const activate = () => {
      const target = element.getAttribute('data-go');
      const menuTexts = {
        build: 'Começar a comunicar',
        favorites: 'Favoritos',
        categories: 'Categorias',
        personalize: 'Personalizar',
        challenge: 'Desafio da comunicação',
        profile: 'Perfil',
        settings: 'Configurações',
        about: 'Sobre o ComunicA'
      };
      const isMainHomeButton = element.closest('.home-screen');
      if (menuTexts[target] && (target !== 'build' || isMainHomeButton)) {
        playMenuVoice(target, menuTexts[target]);
      }
      if (target === 'challenge') STATE.challenge = null;
      go(target);
    };
    element.addEventListener('click', activate);
    element.addEventListener('keydown', activateOnEnterSpace(activate));
  });

  document.querySelectorAll('[data-word]').forEach(element => {
    if (element.classList.contains('circular-key')) {
      const activateCircularKey = () => selectCircularKeyboardKey(element);
      element.addEventListener('click', activateCircularKey);
      element.addEventListener('keydown', activateOnEnterSpace(activateCircularKey));
      element.addEventListener('focus', () => setCircularNavigationKey(element));
      return;
    }
    const activate = event => {
      if (event.target.closest('button, [data-speak], [data-remove-word]')) return;
      const word = wordById(element.getAttribute('data-word'));
      if (!word) return;
      speak(word.label);
      if (element.hasAttribute('data-favorite-word-card')) return;
      addWordToPhrase(word);
    };
    element.addEventListener('click', activate);
    element.addEventListener('keydown', activateOnEnterSpace(activate));
  });

  document.querySelectorAll('.circular-key[data-letter]').forEach(element => {
    const activate = () => selectCircularKeyboardKey(element);
    element.addEventListener('click', activate);
    element.addEventListener('keydown', activateOnEnterSpace(activate));
    element.addEventListener('focus', () => setCircularNavigationKey(element));
  });

  document.querySelectorAll('.circular-side-menu .circular-menu-button').forEach(button => {
    button.addEventListener('focus', () => {
      /* O foco do menu lateral não deve reposicionar o menu nem alterar
         a direção definida pela tecla circular que o abriu. */
      circularMenuReturnRing = STATE.circularActiveRing ?? 0;
      circularMenuReturnIndex = STATE.circularCursorIndex || 0;
    });
  });

  document.querySelectorAll('[data-fav-word]').forEach(element => {
    element.addEventListener('click', event => {
      event.stopPropagation();
      const wordId = element.getAttribute('data-fav-word');
      if (isFavoriteWord(wordId)) {
        showToast('Palavra já adicionada aos favoritos.');
        return;
      }
      toggleFavoriteWord(wordId);
    });
  });

  document.querySelectorAll('[data-remove-word]').forEach(element => {
    element.addEventListener('click', event => {
      event.stopPropagation();
      toggleFavoriteWord(element.getAttribute('data-remove-word'));
    });
  });

  document.querySelectorAll('[data-category]').forEach(element => {
    const activate = () => {
      const categoryId = element.getAttribute('data-category');
      const category = allCategories().find(item => item.id === categoryId);
      if (category) speak(category.label);
      go('categoryDetail', { categoryOpen: categoryId });
    };
    element.addEventListener('click', activate);
    element.addEventListener('keydown', activateOnEnterSpace(activate));
  });

  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.onclick = () => moveCarousel(-1);

  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.onclick = () => moveCarousel(1);

  document.querySelectorAll('.carousel-card[data-pick]').forEach(element => {
    const activate = () => {
      const id = element.getAttribute('data-pick');
      const index = STATE.options.indexOf(id);
      if (index === -1) return;
      if (index === STATE.carouselIndex) {
        confirmSelection();
      } else {
        STATE.carouselIndex = index;
        render();
      }
    };
    element.addEventListener('click', activate);
    /* No carrossel, teclado e analógico não selecionam cartões. */
  });

  const confirmBtn = document.getElementById('confirmBtn');

/* Navegação por teclado/switch na tela de montagem de frase */
document.addEventListener('keydown', event => {
  if (STATE.screen !== 'carouselMode'
      && STATE.data.settings.scanEnabled && (event.key === 'Enter' || event.key === ' ')) {
    const active = document.activeElement;
    if (active && active.matches('[role="button"][tabindex="0"]')) {
      event.preventDefault();
      active.click();
      return;
    }
  }

  const confirmDialog = document.querySelector('.confirm-dialog');
  if (confirmDialog) {
    const confirmButtons = [...confirmDialog.querySelectorAll('button:not([disabled])')];
    if (confirmButtons.length) {
      event.preventDefault();
      const activeIndex = confirmButtons.indexOf(document.activeElement);
      if (event.key === 'Escape') {
        confirmDialog.querySelector('.confirm-dialog-cancel')?.click();
      } else if (['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown', 'Tab'].includes(event.key)) {
        const direction = event.key === 'ArrowLeft' || event.key === 'ArrowUp' || event.key === 'Tab' ? -1 : 1;
        const nextIndex = activeIndex < 0 ? 0 : (activeIndex + direction + confirmButtons.length) % confirmButtons.length;
        document.querySelectorAll('.accessibility-focus').forEach(item => item.classList.remove('accessibility-focus'));
        confirmButtons[nextIndex].focus();
        confirmButtons[nextIndex].classList.add('accessibility-focus');
      } else if (event.key === 'Enter' || event.key === ' ') {
        (activeIndex >= 0 ? confirmButtons[activeIndex] : confirmButtons[0]).click();
      }
      return;
    }
  }

  if (event.key === 'Escape') {
    event.preventDefault();
    if (STATE.screen !== 'home') {
      go('home');
    } else {
      document.activeElement?.blur();
    }
    return;
  }

  if (STATE.screen === 'carouselMode') {
    const controls = carouselControls();
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) {
      if (!controls.length) return;
      event.preventDefault();
      const currentIndex = controls.indexOf(document.activeElement);
      const direction = event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -1 : 1;
      const nextIndex = currentIndex < 0
        ? (direction > 0 ? 0 : controls.length - 1)
        : (currentIndex + direction + controls.length) % controls.length;
      document.querySelectorAll('.accessibility-focus').forEach(item => item.classList.remove('accessibility-focus'));
      controls[nextIndex].focus();
      controls[nextIndex].classList.add('accessibility-focus');
      return;
    }
    if (event.key === 'Enter' || event.key === ' ') {
      if (activateMarkedCarouselTarget()) event.preventDefault();
      return;
    }
    return;
  }

  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    const dialog = document.querySelector('.confirm-dialog');
    const targets = [...(dialog ? dialog.querySelectorAll('button:not([disabled])') : document.querySelectorAll(
      '#app button:not([disabled]), #app [role="button"]:not([aria-disabled="true"]), #app input:not([disabled]), #app select:not([disabled]), #app textarea:not([disabled])'
    ))].filter(element => element.offsetParent !== null);
    if (targets.length) {
      event.preventDefault();
      document.querySelectorAll('.accessibility-focus').forEach(item => item.classList.remove('accessibility-focus'));
      const activeIndex = targets.indexOf(document.activeElement);
      const direction = event.key === 'ArrowDown' ? 1 : -1;
      const nextIndex = activeIndex < 0
        ? (direction > 0 ? 0 : targets.length - 1)
        : (activeIndex + direction + targets.length) % targets.length;
      const target = targets[nextIndex];
      target.focus();
      target.classList.add('accessibility-focus');
      target.closest('.switch')?.classList.add('accessibility-focus');
      return;
    }
  }

  if (STATE.screen !== 'carouselMode') return;

  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    moveCarousel(-1);
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    moveCarousel(1);
  } else if (event.key === 'Enter' || event.key === ' ') {
    if (document.activeElement && document.activeElement.hasAttribute('data-pick')) return;
    event.preventDefault();
    confirmSelection();
  } else if (event.key === 'Backspace') {
    event.preventDefault();
    eraseLast();
  } else if (event.key === 'Escape') {
    event.preventDefault();
    clearPhrase();
  }
});

function typeWelcomeBubble(playVoice = true) {
  const el = document.getElementById('mascotTip');
  if (!el) return;
  const text = `Oi, eu sou o ${MASCOT_NAME}!`;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  el.textContent = '';
  el.classList.add('show');

  clearTimeout(STATE.tipTimer);

  if (reduceMotion) {
    el.textContent = text;
    STATE.tipTimer = setTimeout(() => el.classList.remove('show'), 4200);
    if (playVoice && STATE.data.settings.mascotVoiceEnabled) {
      playMascotVoice();
    }
    return;
  }

  let i = 0;
  const speed = 32;
  const timer = setInterval(() => {
    el.textContent = text.slice(0, i + 1);
    i++;
    if (i >= text.length) {
      clearInterval(timer);
      STATE.tipTimer = setTimeout(() => el.classList.remove('show'), 4200);
    }
  }, speed);

  if (playVoice && STATE.data.settings.mascotVoiceEnabled) {
    playMascotVoice();
  }
}

function initSplash() {
  const splash = document.getElementById('splashScreen');
  const mascotWrap = document.getElementById('splashMascotWrap');
  const hint = document.getElementById('splashHint');
  const app = document.getElementById('app');
  const floatBtn = document.getElementById('mascotFloatBtn');

  if (!splash || !mascotWrap || !floatBtn) return;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  floatBtn.style.opacity = '0';
  floatBtn.style.pointerEvents = 'none';

  splash.focus();

  function showHint() {
    hint.classList.add('show');
  }

  requestAnimationFrame(() => {
    mascotWrap.classList.add('pop-in');
  });

  if (reduceMotion) {
    showHint();
  } else {
    mascotWrap.addEventListener('animationend', showHint, { once: true });
  }

  let started = false;
  let automaticStart = false;

  function beginApp() {
    if (started) return;
    started = true;

    document.removeEventListener('keydown', onKeydown);
    splash.removeEventListener('click', beginApp);
    hint.classList.remove('show');

    if (automaticStart) {
      splash.classList.add('splash-hidden');
      splash.style.display = 'none';
      app.removeAttribute('aria-hidden');
      floatBtn.style.opacity = '1';
      floatBtn.style.pointerEvents = 'auto';
      const audio = document.getElementById('mascotAudio');
      if (audio) {
        audio.preload = 'auto';
      }
      return;
    }

    if (reduceMotion) {
      splash.style.display = 'none';
      app.removeAttribute('aria-hidden');
      floatBtn.style.opacity = '1';
      floatBtn.style.pointerEvents = 'auto';
      return;
    }

    /* Move o mascote até a posição exata do botão flutuante, de forma responsiva */
    const targetRect = floatBtn.getBoundingClientRect();
    const startRect = mascotWrap.getBoundingClientRect();

    mascotWrap.style.left = startRect.left + 'px';
    mascotWrap.style.top = startRect.top + 'px';
    mascotWrap.style.width = startRect.width + 'px';
    mascotWrap.style.height = startRect.height + 'px';
    mascotWrap.classList.add('to-corner');

    void mascotWrap.offsetWidth; /* força o reflow antes de animar */

    requestAnimationFrame(() => {
      mascotWrap.style.left = targetRect.left + 'px';
      mascotWrap.style.top = targetRect.top + 'px';
      mascotWrap.style.width = targetRect.width + 'px';
      mascotWrap.style.height = targetRect.height + 'px';
      mascotWrap.style.opacity = '0';
    });

    splash.classList.add('splash-hidden');
    app.removeAttribute('aria-hidden');

    setTimeout(() => {
      splash.style.display = 'none';
      floatBtn.style.opacity = '1';
      floatBtn.style.pointerEvents = 'auto';
    }, 720);
  }

  function onKeydown(event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      beginApp();
    }
  }

  document.addEventListener('keydown', onKeydown);
  splash.addEventListener('click', beginApp);

  window.showLoadingSplash = () => {
    started = true;
    splash.style.display = 'flex';
    splash.classList.remove('splash-hidden');
    app.setAttribute('aria-hidden', 'true');
    mascotWrap.classList.remove('to-corner');
    mascotWrap.style.opacity = '1';

    setTimeout(() => {
      splash.classList.add('splash-hidden');
      app.removeAttribute('aria-hidden');
      setTimeout(() => {
        splash.style.display = 'none';
      }, 600);
    }, 300);
  };

  const manualSplash =
    localStorage.getItem('comunica:juniorEntryMode') === '1' ||
    sessionStorage.getItem('comunica:manualJuniorSplash') === '1';

  localStorage.removeItem('comunica:juniorEntryMode');
  sessionStorage.removeItem('comunica:manualJuniorSplash');

  const shouldAutoStart =
    !manualSplash &&
    (STATE.data.profile.onboarded ||
      localStorage.getItem('comunica:goToProfileSelection') === '1');

  if (shouldAutoStart) {
    automaticStart = true;
    setTimeout(beginApp, 300);
  }
}

/* Controle por joystick/gamepad: analógico navega, clique no analógico seleciona e B volta. */
function initGamepadControls() {
  if (!('getGamepads' in navigator)) return;
  let previous = [];
  let lastAxisMove = 0;
  const markGamepadFocus = element => {
    document.querySelectorAll('.accessibility-focus').forEach(item => item.classList.remove('accessibility-focus'));
    element?.classList.add('accessibility-focus');
    element?.closest('.switch')?.classList.add('accessibility-focus');
  };

  const poll = timestamp => {
    const pad = [...(navigator.getGamepads?.() || [])].find(Boolean);
    if (pad) {
      const pressed = index => Boolean(pad.buttons[index]?.pressed);
      const rising = index => pressed(index) && !previous[index];
      const targets = () => {
        const dialog = document.querySelector('.confirm-dialog');
        return [...(dialog ? dialog.querySelectorAll('button:not([disabled])') : document.querySelectorAll(
          '#app button:not([disabled]), #app [role="button"]:not([aria-disabled="true"]), #app input:not([disabled]), #app select:not([disabled]), #app textarea:not([disabled])'
        ))].filter(element => element.offsetParent !== null);
      };

      const dialog = document.querySelector('.confirm-dialog');
      if (dialog) {
        const dialogTargets = [...dialog.querySelectorAll('button:not([disabled])')];
        if (rising(0) || rising(10)) {
          const active = dialog.contains(document.activeElement)
            ? document.activeElement
            : dialogTargets[0];
          active?.click();
        }
        if (rising(1)) {
          dialog.querySelector('.confirm-dialog-cancel')?.click();
        }
        if (timestamp - lastAxisMove > 180 && dialogTargets.length) {
          const x = pad.axes[0] || 0;
          const y = pad.axes[1] || 0;
          const direction = Math.abs(x) > 0.4 || Math.abs(y) > 0.4;
          if (direction) {
            const current = dialogTargets.indexOf(document.activeElement);
            const next = current < 0 ? 0 : (current + 1) % dialogTargets.length;
            dialogTargets[next].focus();
            markGamepadFocus(dialogTargets[next]);
            lastAxisMove = timestamp;
          }
        }
        previous = pad.buttons.map(button => Boolean(button.pressed));
        requestAnimationFrame(poll);
        return;
      }

      if (rising(0) || rising(10)) {
        const splash = document.getElementById('splashScreen');
        const splashVisible = splash && !splash.classList.contains('splash-hidden')
          && splash.style.display !== 'none';
        if (splashVisible) {
          splash.click();
        } else if (document.querySelector('.confirm-dialog')) {
          const dialog = document.querySelector('.confirm-dialog');
          const active = dialog.contains(document.activeElement)
            ? document.activeElement
            : dialog.querySelector('button:not([disabled])');
          active?.click();
        } else if (STATE.screen === 'carouselMode') {
          activateMarkedCarouselTarget();
        } else {
          const active = document.activeElement;
          if (active && active !== document.body && typeof active.click === 'function') {
            markGamepadFocus(active);
            active.click();
          } else {
            const firstTarget = targets()[0];
            firstTarget?.focus();
            markGamepadFocus(firstTarget);
          }
        }
      }
      if (rising(1)) {
        const dialogCancel = document.querySelector('.confirm-dialog-cancel');
        if (dialogCancel) {
          dialogCancel.click();
        } else if (STATE.screen === 'carouselMode') {
          // No carrossel, B não abandona a tela.
        } else if (STATE.screen !== 'home') {
          go('home');
        }
      }
      if (timestamp - lastAxisMove > 180) {
        const x = pad.axes[0] || 0;
        const y = pad.axes[1] || 0;
        const direction = Math.abs(x) > 0.4 ? (x > 0 ? 1 : -1) : Math.abs(y) > 0.4 ? (y > 0 ? 1 : -1) : 0;
        if (direction) {
          const list = STATE.screen === 'carouselMode' ? carouselControls() : targets();
          const current = list.indexOf(document.activeElement);
          const next = current < 0 ? 0 : (current + direction + list.length) % list.length;
          list[next]?.focus();
          markGamepadFocus(list[next]);
          lastAxisMove = timestamp;
        }
      }
      previous = pad.buttons.map(button => Boolean(button.pressed));
    }
    requestAnimationFrame(poll);
  };

  requestAnimationFrame(poll);
}

// Quando a IA responde com menos opções, completa com poucas palavras locais,
// mantendo a maioria das teclas baseada na resposta do Gemini.
function completarComMaioriaGemini(sugestoesIA, quantidade, reserva) {
    const principais = [...new Set(sugestoesIA.filter((palavra) => typeof palavra === "string" && palavra.trim()))]
        .slice(0, quantidade);
    const limiteReserva = Math.min(3, Math.max(0, principais.length - 1), quantidade - principais.length);
    const extras = [...new Set(reserva.filter((palavra) => !principais.includes(palavra)))].slice(0, limiteReserva);
    return principais.concat(extras);
}

}

async function categorizarPalavraComGemini(palavra) {
    if (!(await geminiDisponivel())) return null;
    const categorias = allCategories().map(({ id, label }) => ({ id, label }));
    if (!categorias.length) return null;
    try {
        const resposta = await fetch(GEMINI_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: `Classifique a palavra ou expressão para um teclado de Comunicação Alternativa em português do Brasil. Escolha somente uma categoria da lista, sem criar categorias. Palavra: ${JSON.stringify(palavra)}. Categorias: ${JSON.stringify(categorias)}. Responda somente JSON no formato {"id":"ID_DA_CATEGORIA"}.` }] }],
                generationConfig: { temperature: 0.1, responseMimeType: "application/json" }
            })
        });
        const dados = await resposta.json();
        if (!resposta.ok) {
            console.warn("Falha na categorização Gemini:", resposta.status, dados.error?.message || dados);
            return null;
        }
        const texto = dados.candidates?.[0]?.content?.parts?.map((parte) => parte.text || "").join("").trim() || "";
        const json = texto.match(/\{[\s\S]*\}/)?.[0];
        if (!json) {
            console.warn("Gemini retornou uma resposta sem JSON de categoria:", texto);
            return null;
        }
        const id = JSON.parse(json).id;
        return categorias.some((categoria) => categoria.id === id) ? id : null;
    } catch (erro) {
        console.warn("Não foi possível categorizar a palavra com Gemini:", erro);
        return null;
    }
}

        ["necessidades", /\b(banheiro|ajuda|dor|sono|fome|sede|descanso|beber|comer|dormir|preciso)\b/],
        ["sentimentos", /\b(feliz|triste|bravo|brava|medo|cansado|cansada|bem|mal|ansioso|ansiosa|saudade)\b/],
        ["lugares", /\b(casa|escola|parque|hospital|quarto|cozinha|rua|banheiro|mercado|cidade)\b/],
        ["atividades", /\b(brincar|jogar|assistir|ler|desenhar|cantar|passear|dancar|estudar|nadar)\b/],
        ["acoes", /\b(quero|gosto|vou|estou|tenho|fazer|ir|vir|dar|ver|falar|preciso)\b/]

    const regra = regras.find(([id, padrao]) => idsDisponiveis.has(id) && padrao.test(texto));

// Endpoint público do LanguageTool: não exige chave para uso moderado.
const LANGUAGETOOL_URL = "https://api.languagetool.org/v2/check";
const LANGUAGETOOL_IDIOMA = "pt-BR";

// Pede ao Gemini palavras/expressões curtas para continuar a frase atual.
// Retorna null se não há chave ou se a chamada falha; nesse caso, a argola
// externa usa o vocabulário local padrão e a barra usa palavras personalizadas.
const geminiSuggestionCache = new Map();

function sugerirComGemini(frase, tipo = "palavras", palavraSelecionada = "") {
    const cacheKey = JSON.stringify([frase, tipo, palavraSelecionada]);
    if (geminiSuggestionCache.has(cacheKey)) return geminiSuggestionCache.get(cacheKey);
    const solicitacao = consultarGemini(frase, tipo, palavraSelecionada);
    geminiSuggestionCache.set(cacheKey, solicitacao);
    solicitacao.then((resultado) => {
        if (!resultado) geminiSuggestionCache.delete(cacheKey);
        while (geminiSuggestionCache.size > 24) {
            geminiSuggestionCache.delete(geminiSuggestionCache.keys().next().value);
        }
    });
    return solicitacao;
}

async function consultarGemini(frase, tipo, palavraSelecionada) {
    if (!(await geminiDisponivel())) return null;
    try {
        const generoContexto = tipo === "palavras" ? generoPronomeNaFrase(frase) : null;
        const nomesPermitidos = generoContexto ? palavrasPersonalizadasPorGenero(generoContexto).map((word) => word.label) : [];
        const prompt = tipo === "frases"
            ? "Você ajuda um teclado de Comunicação Alternativa e Aumentativa em português do Brasil. Dada uma frase parcial, sugira até 4 frases completas, curtas e naturais que a pessoa provavelmente quer comunicar, usando as palavras escolhidas como base. Responda apenas um array JSON de strings."
            : `Você sugere vocabulário para um teclado de Comunicação Alternativa e Aumentativa em português do Brasil. Use como contexto principal a palavra que a pessoa acabou de selecionar na argola interior: "${palavraSelecionada || "(não informada)"}". Considere também a frase parcial. ${generoContexto ? `Mantenha a concordância no gênero ${generoContexto}. Para sugerir nomes de pessoas, use somente estes nomes já cadastrados: ${JSON.stringify(nomesPermitidos)}.` : ""} Gere exatamente 10 palavras ou expressões curtas e naturais para continuar a comunicação, relacionadas à palavra selecionada. Não repita palavras já presentes. Responda apenas um array JSON de strings.`;
        const resposta = await fetch(GEMINI_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: `${prompt}\nFrase parcial: ${frase || "(frase vazia; sugira palavras para começar)"}` }] }],
                generationConfig: { temperature: 0.7, responseMimeType: "application/json" }
            })
        });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.error?.message || `Gemini HTTP ${resposta.status}`);
        const texto = dados.candidates?.[0]?.content?.parts?.map((parte) => parte.text || "").join("").trim() || "";
        const lista = JSON.parse(texto);
        if (!Array.isArray(lista)) return null;
        const jaUsadas = new Set(tipo === "palavras" ? frase.split(/\s+/).map(normalizarPalavra) : []);
        return [...new Set(lista.filter((item) => typeof item === "string")
            .map((item) => item.trim().replace(/^[-•\d.\s]+/, "").slice(0, 48))
            .filter((item) => item && !jaUsadas.has(normalizarPalavra(item))))].slice(0, tipo === "frases" ? 4 : 10);
    } catch (erro) {
        console.warn("Não foi possível buscar sugestões do Gemini:", erro);
        return null;
    }
}

// Envia o texto ao LanguageTool e devolve a versão corrigida, aplicando a
// primeira sugestão de cada erro encontrado. Se a chamada falhar, devolve
// o texto original sem alterações.
async function corrigirComLanguageTool(texto) {
    if (!texto) return texto;
    try {
        const corpo = new URLSearchParams({ text: texto, language: LANGUAGETOOL_IDIOMA });
        const resposta = await fetch(LANGUAGETOOL_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: corpo
        });
        if (!resposta.ok) return texto;

        const dados = await resposta.json();
        let corrigido = texto;
        // Aplica as correções de trás para frente, para não bagunçar os índices dos erros seguintes.
        const erros = [...(dados.matches || [])].sort((a, b) => b.offset - a.offset);
        erros.forEach((erro) => {
            const sugestao = erro.replacements?.[0]?.value;
            if (sugestao !== undefined) {
                corrigido = corrigido.slice(0, erro.offset) + sugestao + corrigido.slice(erro.offset + erro.length);
            }
        });
        return corrigido;
    } catch (erro) {
        console.warn("Não foi possível corrigir o texto com o LanguageTool:", erro);
        return texto;
    }
}

async function corrigirComGemini(texto) {
    if (!texto || !(await geminiDisponivel())) return null;
    const palavrasPersonalizadas = STATE.data.customWords.map((word) => word.label).filter(Boolean);
    try {
        const resposta = await fetch(GEMINI_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: `Revise esta frase curta de Comunicação Alternativa em português do Brasil. Corrija concordância de gênero e número. Se um nome ou palavra cadastrada aparecer com erro de digitação, use a grafia exata da lista personalizada. Palavras personalizadas permitidas: ${JSON.stringify(palavrasPersonalizadas)}. Se um pronome como ela/ele estiver imediatamente antes do nome que identifica a mesma pessoa, retire a repetição do pronome e mantenha o nome exatamente como cadastrado. Preserve a intenção e não invente nomes nem informações. Retorne somente um objeto JSON no formato {"texto":"frase corrigida"}. Frase: ${texto}` }] }],
                generationConfig: { temperature: 0.1, responseMimeType: "application/json" }
            })
        });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.error?.message || `Gemini HTTP ${resposta.status}`);
        const conteudo = dados.candidates?.[0]?.content?.parts?.map((parte) => parte.text || "").join("").trim() || "";
        const resultado = JSON.parse(conteudo);
        return typeof resultado.texto === "string" && resultado.texto.trim() ? resultado.texto.trim() : null;
    } catch (erro) {
        console.warn("Não foi possível corrigir a frase com o Gemini:", erro);
        return null;
    }
}

function distanciaEdicaoUnica(a, b) {
    if (a === b) return 0;
    if (Math.abs(a.length - b.length) > 1) return 2;
    let i = 0;
    let j = 0;
    let diferencas = 0;
    while (i < a.length && j < b.length) {
        if (a[i] === b[j]) { i += 1; j += 1; continue; }
        diferencas += 1;
        if (diferencas > 1) return diferencas;
        if (a.length > b.length) i += 1;
        else if (b.length > a.length) j += 1;
        else { i += 1; j += 1; }
    }
    if (i < a.length || j < b.length) diferencas += 1;
    return diferencas;
}

function canonicalizarNomesPersonalizados(texto) {
    const palavrasPessoas = STATE.data.customWords.filter((word) => {
        const categoria = allCategories().find((item) => item.id === word.cat);
        return word.cat === "pessoas" || /pessoa|famil|amig|relacion/.test(normalizarPalavra(categoria?.label || ""));
    });
    const tokens = [...texto.matchAll(/[\p{L}]+/gu)];
    let indiceToken = 0;
    return texto.replace(/[\p{L}]+/gu, (token) => {
        const indiceAtual = indiceToken++;
        const normalizado = normalizarPalavra(token);
        const exato = palavrasPessoas.find((word) => normalizarPalavra(word.label) === normalizado);
        if (exato) return exato.label;
        const tokenAnterior = normalizarPalavra(tokens[indiceAtual - 1]?.[0] || "");
        if (!["ela", "ele", "elas", "eles"].includes(tokenAnterior) || normalizado.length < 3) return token;
        const aproximado = palavrasPessoas.find((word) => {
            const nome = normalizarPalavra(word.label);
            return !/\s/.test(nome) && distanciaEdicaoUnica(normalizado, nome) === 1;
        });
        return aproximado ? aproximado.label : token;
    });
}

let atualizarBarraTimer = null;
let sugestaoSelecionadaBarra = "";

// Renderiza sugestões rápidas abaixo do campo. Cada opção completa a frase
// atual, como a barra preditiva de um teclado convencional.
function mostrarFrasesProntas(frases, fonte = "local") {
    if (!frasesProntasEl) return;
    frasesProntasEl.innerHTML = "";
    const rotulo = fonte === "mista" ? "Sugestões Gemini e personalizadas" : fonte === "ia" ? "Sugestões Gemini" : fonte === "personalizadas" ? "Palavras personalizadas" : "Palavras salvas";
    frasesProntasEl.dataset.rotulo = rotulo;
    frasesProntasEl.setAttribute("aria-label", `${rotulo} de palavras e complementos`);
    if (!frases || !frases.length) return;
    frases.forEach((frase) => {
        const botao = document.createElement("button");
        botao.type = "button";
        botao.className = "frase-pronta palavra-sugerida";
        botao.textContent = frase;
        const selecionada = normalizarPalavra(frase) === normalizarPalavra(sugestaoSelecionadaBarra);
        botao.dataset.selecionada = selecionada ? "true" : "false";
        botao.setAttribute("aria-pressed", String(selecionada));
        botao.addEventListener("click", () => {
            sugestaoSelecionadaBarra = frase;
            adicionarPalavra(frase);
        });
        frasesProntasEl.appendChild(botao);
    });
}

function atualizarFrasesProntas() {
    const frase = valor.textContent.trim();
    clearTimeout(atualizarBarraTimer);
    const genero = generoDoPronomeAtual();
    if (genero) {
        const palavras = palavrasPersonalizadasPorGenero(genero).map((word) => word.label);
        const lista = [...new Set([sugestaoSelecionadaBarra, ...palavras].filter(Boolean))].slice(0, 3);
        mostrarFrasesProntas(lista, "personalizadas");
        return;
    }
    const tokens = frase.split(/\s+/).filter(Boolean);
    const ultima = normalizarPalavra(tokens.at(-1) || "");
    const usadas = new Set(tokens.map(normalizarPalavra));
    const baseLocal = STATE.data.customWords.map((word) => word.label).filter(Boolean);
    const locais = [...new Set([sugestaoSelecionadaBarra, ...baseLocal
        .filter((item) => !usadas.has(normalizarPalavra(item)))].filter(Boolean))].slice(0, 2);
    mostrarFrasesProntas(locais);

    // Espera a digitação parar antes de pedir ao Gemini. A argola externa e a
    // barra reaproveitam a mesma resposta quando consultam a mesma frase.
    atualizarBarraTimer = setTimeout(async () => {
        const sugestoesGemini = await sugerirComGemini(frase, "palavras", tokens.at(-1) || "");
        if (valor.textContent.trim() === frase && !generoDoPronomeAtual() && sugestoesGemini?.length) {
            const sugestoesDaBarra = [...new Set([sugestaoSelecionadaBarra, ...sugestoesGemini.slice(0, 2), ...locais].filter(Boolean))].slice(0, 3);
            const temPersonalizada = sugestoesDaBarra.some((item) => STATE.data.customWords.some((word) => normalizarPalavra(word.label) === normalizarPalavra(item)));
            mostrarFrasesProntas(sugestoesDaBarra, temPersonalizada ? "mista" : "ia");
        }
    }, 450);
}

function atualizarAnelPalavrasChave() {
    atualizarTextoDasTeclas(aneis[0], palavrasChave);
}

function palavrasPersonalizadasPorGenero(genero) {
    const termosFemininos = new Set([
        "mae", "tia", "irma", "filha", "mulher", "menina", "amiga",
        "professora", "doutora", "senhora", "rainha", "madrinha", "prima",
        "alice", "beatriz", "carol", "ester", "ines", "isabel", "joyce",
        "lais", "luz", "nicole", "rachel", "raquel", "sarah"
    ]);
    const termosMasculinos = new Set([
        "pai", "tio", "irmao", "filho", "homem", "menino", "amigo",
        "professor", "doutor", "senhor", "rei", "padrinho", "primo",
        "gabriel", "miguel", "rafael", "daniel", "samuel", "jose", "davi"
    ]);
    return STATE.data.customWords.filter((word) => {
        const categoria = allCategories().find((item) => item.id === word.cat);
        const categoriaPessoas = word.cat === "pessoas" || /pessoa|famil|amig|relacion/.test(normalizarPalavra(categoria?.label || ""));
        if (!categoriaPessoas) return false;
        const nome = normalizarPalavra(word.label);
        const nomeComAcento = String(word.label).toLocaleLowerCase("pt-BR");
        if (genero === "feminino") return word.gender === "feminino" || word.gender === "female" || nomeComAcento === "avó" || termosFemininos.has(nome) || /a$/.test(nome);
        return word.gender === "masculino" || word.gender === "male" || nomeComAcento === "avô" || termosMasculinos.has(nome) || /o$/.test(nome);
    });
}

function generoPronomeNaFrase(texto) {
    const tokens = String(texto || "").split(/\s+/).map(normalizarPalavra).filter(Boolean);
    for (let indice = tokens.length - 1; indice >= 0; indice -= 1) {
        if (["ela", "elas"].includes(tokens[indice])) return "feminino";
        if (["ele", "eles"].includes(tokens[indice])) return "masculino";
    }
    return null;
}

function generoDoPronomeAtual() {
    const ultima = palavraAtual();
    if (["ela", "elas"].includes(ultima)) return "feminino";
    if (["ele", "eles"].includes(ultima)) return "masculino";
    return null;
}

function mostrarSugestoesPersonalizadasPorGenero(anel, genero, embaralharLista = false) {
    const palavras = palavrasPersonalizadasPorGenero(genero).map((word) => word.label);
    if (!palavras.length) {
        showToast(`Adicione palavras ${genero === "feminino" ? "femininas" : "masculinas"} em Personalizar, na categoria Pessoas.`);
        esconderAnelSugestoes();
        return false;
    }
    const lista = (embaralharLista ? embaralhar(palavras) : palavras).slice(0, 10);
    mostrarFrasesProntas(lista, "palavras");
    if (anel.quantidade !== lista.length) criarTeclasDoAnel(anel, lista.length, false);
    atualizarTextoDasTeclas(anel, lista);
    return true;
}

// Preenche o anel indicado (0 ou 1) com sugestões para continuar a frase.
// Como as duas argolas se revezam nesse papel, essa função recebe qual
// delas atualizar, em vez de mexer sempre na mesma.
function atualizarSugestoesNoAnel(indiceAnel) {
    const anel = aneis[indiceAnel];
    const genero = generoDoPronomeAtual();
    if (genero) {
        const listaPersonalizada = palavrasPersonalizadasPorGenero(genero).map((word) => word.label);
        mostrarFrasesProntas(listaPersonalizada, "palavras");
    }
    const base = (sugestoesPorPalavra[palavraAtual()] || sugestoesGenericas);
    const usadas = new Set(valor.textContent.trim().split(/\s+/).map(normalizarPalavra));
    const locais = [...new Set(base.concat(frasesRapidas, palavrasChave)
        .filter((palavra) => !usadas.has(normalizarPalavra(palavra))))].slice(0, 6);
    if (anel.quantidade !== locais.length) criarTeclasDoAnel(anel, locais.length, false);
    atualizarTextoDasTeclas(anel, locais);

    // Atualiza primeiro com o vocabulário local; quando o Gemini responder,
    // troca as opções apenas se a frase ainda for a mesma.
    const fraseSolicitada = valor.textContent.trim();
    const palavraSelecionada = fraseSolicitada.split(/\s+/).filter(Boolean).at(-1) || "";
    sugerirComGemini(fraseSolicitada, "palavras", palavraSelecionada).then((sugestoesIA) => {
        if (modoAlfabeto || !valor || valor.textContent.trim() !== fraseSolicitada || !sugestoesVisiveis) return;
        if (!sugestoesIA?.length) {
            if (!locais.length) {
                mostrarFrasesProntas([]);
                showToast("Não há outras sugestões locais para esta palavra.");
            }
            return;
        }
        const focoNaArgola = anel.teclas.includes(document.activeElement);
        const palavrasSalvas = new Set(STATE.data.customWords.map((word) => normalizarPalavra(word.label)));
        const opcoes = completarComMaioriaGemini(
            sugestoesIA.filter((palavra) => !palavrasSalvas.has(normalizarPalavra(palavra))),
            10,
            []
        );
        if (!opcoes.length) return;
        if (anel.quantidade !== opcoes.length) criarTeclasDoAnel(anel, opcoes.length, false);
        atualizarTextoDasTeclas(anel, opcoes);
        if (focoNaArgola) focarTecla(indiceAnel, Math.min(posicaoAtualIndice, opcoes.length - 1));
    });
    return locais.length > 0;
}

function embaralhar(lista) {
    const copia = [...lista];
    for (let i = copia.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
}

// Botão "recarregar": gera novas opções para a argola externa depois que a
// frase começou. O Gemini tem prioridade; sem resposta, mostra até seis
// alternativas locais. A argola inicial permanece fixa.
async function recarregarSugestoes() {
    // No modo alfabético não há o que recarregar (as 26 letras já estão
    // todas na argola); "recarregar" fica sem efeito até sair do modo.
    if (modoAlfabeto) return;

    const frase = valor.textContent.trim();
    if (!frase) {
        showToast("Escolha uma palavra para receber sugestões do Gemini na argola externa.");
        return;
    }
    const indiceAnel = 1;
    anelAtualIndice = indiceAnel;
    if (indiceAnel === 1 && !sugestoesVisiveis) return;
    const anel = aneis[indiceAnel];

    // Mantém as palavras personalizadas compatíveis com o pronome nos campos
    // abaixo da frase; o recarregamento da argola continua sugerindo continuações.
    const genero = generoDoPronomeAtual();
    if (frase && genero) {
        const palavras = palavrasPersonalizadasPorGenero(genero).map((word) => word.label);
        mostrarFrasesProntas(palavras, "palavras");
    }

    if (!(await geminiDisponivel())) {
        showToast("Gemini não configurado no servidor. Mantendo sugestões locais.");
    }

    const palavraSelecionada = frase.split(/\s+/).filter(Boolean).at(-1) || "";
    const sugestoesIA = await sugerirComGemini(`${frase} (sugira opções diferentes das mais óbvias)`, "palavras", palavraSelecionada);
    if (sugestoesIA && sugestoesIA.length) {
        const palavrasSalvas = new Set(STATE.data.customWords.map((word) => normalizarPalavra(word.label)));
        const opcoes = completarComMaioriaGemini(
            sugestoesIA.filter((palavra) => !palavrasSalvas.has(normalizarPalavra(palavra))),
            10,
            []
        );
        if (opcoes.length) {
            if (anel.quantidade !== opcoes.length) criarTeclasDoAnel(anel, opcoes.length, false);
            atualizarTextoDasTeclas(anel, opcoes);
            return;
        }
    }

    const base = (sugestoesPorPalavra[palavraAtual()] || sugestoesGenericas);
    const usadas = new Set(frase.split(/\s+/).map(normalizarPalavra));
    const novaLista = embaralhar([...new Set(base.concat(frasesRapidas, palavrasChave)
        .filter((palavra) => !usadas.has(normalizarPalavra(palavra))))]).slice(0, 6);
    if (!novaLista.length) {
        criarTeclasDoAnel(anel, 0, false);
        mostrarFrasesProntas([]);
        showToast("Não há outras sugestões locais para esta palavra.");
        return;
    }
    if (anel.quantidade !== novaLista.length) criarTeclasDoAnel(anel, novaLista.length, false);
    atualizarTextoDasTeclas(anel, novaLista);
}

// Reseta o teclado para a configuração inicial: argola de dentro volta a
// mostrar as palavras-chave e a argola de fora desaparece de novo.
function voltarConfiguracaoInicial() {
    if (modoAlfabeto) {
        criarTeclasDoAnel(aneis[0], 9, false);
        modoAlfabeto = false;
        document.querySelectorAll(".botao-alfabeto").forEach((botao) => botao.classList.remove("ativo"));
    }
    atualizarAnelPalavrasChave();
    esconderAnelSugestoes();
    if (!valor?.textContent.trim()) sugestaoSelecionadaBarra = "";
    atualizarFrasesProntas();
    novaPalavraAlfabeto = true;
    noBotaoCentral = false;
    anelAtualIndice = 0;
    posicaoAtualIndice = 0;
    focarTecla(0, 0);
}

// Posiciona os botões do menu lateral com a mesma trigonometria usada nas
// teclas (ângulo + raio a partir do centro), formando um arco que encaixa
// exatamente na circunferência da argola visível no momento — mais perto
// da borda da argola de dentro (raio 36%) e mais longe quando a argola de
// fora está aberta (raio 46%, acompanhando o tamanho maior dela).
const ANGULO_BASE_MENU = { direita: 0, baixo: 90, esquerda: 180, cima: -90 };
const ARCO_MENU_GRAUS = 110;

function posicionarMenuOrbital() {
    if (!menuOrbital || !botoesMenu.length) return;

    const anguloBase = ANGULO_BASE_MENU[direcaoAtiva] ?? 0;
    const area = menuOrbital.getBoundingClientRect();
    const tecladoRect = document.getElementById("teclado")?.getBoundingClientRect();
    if (!area.width || !area.height || !tecladoRect?.width || !tecladoRect?.height) return;
    // O menu e o teclado compartilham o mesmo centro. Calcula-se um único
    // raio que caiba com todos os botões; limitar cada botão separadamente
    // fazia vários deles se acumularem na borda quando a argola abria.
    const centroX = tecladoRect.left + tecladoRect.width / 2 - area.left;
    const centroY = tecladoRect.top + tecladoRect.height / 2 - area.top;
    const raioDesejado = tecladoRect.width * (sugestoesVisiveis ? 0.52 : 0.43);
    const total = botoesMenu.length;

    const angulos = botoesMenu.map((_, indice) => {
        const offset = total > 1
            ? (indice - (total - 1) / 2) * (ARCO_MENU_GRAUS / (total - 1))
            : 0;
        return anguloBase + offset;
    });
    const raioSeguro = botoesMenu.reduce((limite, botao, indice) => {
        const anguloRad = angulos[indice] * Math.PI / 180;
        const cos = Math.cos(anguloRad);
        const sin = Math.sin(anguloRad);
        const metadeLargura = (botao.offsetWidth || 54) / 2;
        const metadeAltura = (botao.offsetHeight || 54) / 2;
        let limiteBotao = Infinity;

        if (cos > 0.001) limiteBotao = Math.min(limiteBotao, (area.width - metadeLargura - 4 - centroX) / cos);
        else if (cos < -0.001) limiteBotao = Math.min(limiteBotao, (centroX - metadeLargura - 4) / -cos);
        if (sin > 0.001) limiteBotao = Math.min(limiteBotao, (area.height - metadeAltura - 4 - centroY) / sin);
        else if (sin < -0.001) limiteBotao = Math.min(limiteBotao, (centroY - metadeAltura - 4) / -sin);
        return Math.min(limite, limiteBotao);
    }, Infinity);
    const raio = Math.max(0, Math.min(raioDesejado, raioSeguro));

    botoesMenu.forEach((botao, indice) => {
        const anguloGraus = angulos[indice];
        const anguloRad = anguloGraus * Math.PI / 180;
        const xDesejado = centroX + Math.cos(anguloRad) * raio;
        const yDesejado = centroY + Math.sin(anguloRad) * raio;

        botao.style.left = `${xDesejado}px`;
        botao.style.top = `${yDesejado}px`;
        botao.dataset.angulo = String(anguloGraus);
    });
}

let menuOrbitalResizeFrame = 0;
window.addEventListener('resize', () => {
    cancelAnimationFrame(menuOrbitalResizeFrame);
    menuOrbitalResizeFrame = requestAnimationFrame(posicionarMenuOrbital);
});

function mostrarAnelSugestoes() {
    sugestoesVisiveis = true;
    aneis[1].elemento.classList.add("visivel");
    posicionarMenuOrbital();
}

function esconderAnelSugestoes() {
    sugestoesVisiveis = false;
    aneis[1].elemento.classList.remove("visivel");
    aneis[1].cunha.classList.remove("ativa");
    aneis[1].teclas.forEach((tecla) => (tecla.tabIndex = -1));
    posicionarMenuOrbital();
}

function adicionarPalavra(texto) {
    if (!texto) return;
    valor.textContent = `${valor.textContent.trim()} ${texto}`.trim();
    atualizarFrasesProntas();
}

// ==== Modo alfabético (botão "Aa" no centro da argola de dentro) ====
// Reconstrói a própria argola de dentro (a "argola inicial") com as 26
// letras do alfabeto, no lugar do que ela estivesse mostrando (palavras-
// chave ou sugestões). Só entra nesse modo quando o botão central é clicado.
const alfabeto = "abcdefghijklmnopqrstuvwxyz".split("");
let modoAlfabeto = false;
let novaPalavraAlfabeto = true;

// A argola interna mantém as palavras-chave; as continuações ficam na externa.
function restaurarConteudoAnelInicial() {
    atualizarAnelPalavrasChave();
}

function entrarModoAlfabeto() {
    modoAlfabeto = true;
    novaPalavraAlfabeto = true;
    criarTeclasDoAnel(aneis[0], alfabeto.length, true);
    atualizarTextoDasTeclas(aneis[0], alfabeto);
    anelAtualIndice = 0;
    posicaoAtualIndice = 0;
    focarTecla(0, 0);
}

function sairModoAlfabeto() {
    modoAlfabeto = false;
    criarTeclasDoAnel(aneis[0], 9, false);
    restaurarConteudoAnelInicial();
    anelAtualIndice = 0;
    posicaoAtualIndice = 0;
    atualizarFrasesProntas();
    if (valor.textContent.trim() && sugestoesVisiveis) atualizarSugestoesNoAnel(1);
    focarTecla(0, 0);
}

function alternarModoAlfabeto() {
    noBotaoCentral = false;
    if (modoAlfabeto) sairModoAlfabeto(); else entrarModoAlfabeto();
    document.querySelectorAll(".botao-alfabeto").forEach((botao) => botao.classList.toggle("ativo", modoAlfabeto));
}

// Digita uma letra na palavra atual: a primeira letra depois de entrar no
// modo alfabético começa uma palavra nova (com espaço); as seguintes
// grudam direto na anterior, sem espaço, até o usuário sair do modo.
function adicionarLetra(letra) {
    if (novaPalavraAlfabeto) {
        valor.textContent = `${valor.textContent.trim()} ${letra}`.trim();
        novaPalavraAlfabeto = false;
    } else {
        valor.textContent += letra;
    }
    atualizarFrasesProntas();
}

// Usada tanto pelo clique quanto pela tecla Enter/Espaço. As palavras-chave
// ficam na argola interna; as continuações permanecem sempre na argola externa.
function selecionarPalavra(tecla) {
    const indiceReal = aneis.findIndex((anel) => anel.teclas.includes(tecla));
    if (indiceReal < 0) return;
    anelAtualIndice = indiceReal;
    posicaoAtualIndice = aneis[indiceReal].teclas.indexOf(tecla);

    if (modoAlfabeto) {
        // No modo alfabético só a própria argola de dentro (agora com as
        // letras) responde; a de fora fica bloqueada até sair do modo.
        if (aneis[0].teclas.includes(tecla)) adicionarLetra(tecla.dataset.valor);
        return;
    }

    adicionarPalavra(tecla.dataset.valor);

    const anelDestino = 1;
    if (!sugestoesVisiveis) mostrarAnelSugestoes();
    const temSugestoes = atualizarSugestoesNoAnel(anelDestino);
    if (temSugestoes === false) {
        anelAtualIndice = 0;
        posicaoAtualIndice = 0;
        focarTecla(0, 0);
        return;
    }

    anelAtualIndice = anelDestino;
    posicaoAtualIndice = 0;
    focarTecla(anelDestino, 0);
}

function direcaoDoAngulo(angulo) {
    const x = Math.cos(angulo * Math.PI / 180);
    const y = Math.sin(angulo * Math.PI / 180);
    if (Math.abs(x) >= Math.abs(y)) return x >= 0 ? "direita" : "esquerda";
    return y >= 0 ? "baixo" : "cima";
}

function indiceMaisProximoNoAnel(origem, destino, posicao) {
    const anguloOrigem = (posicao / origem.teclas.length) * 2 * Math.PI - Math.PI / 2;
    let melhorIndice = 0;
    let menorDistancia = Infinity;
    destino.teclas.forEach((_, indice) => {
        const anguloDestino = (indice / destino.teclas.length) * 2 * Math.PI - Math.PI / 2;
        const distancia = Math.abs(Math.atan2(Math.sin(anguloDestino - anguloOrigem), Math.cos(anguloDestino - anguloOrigem)));
        if (distancia < menorDistancia) {
            menorDistancia = distancia;
            melhorIndice = indice;
        }
    });
    return melhorIndice;
}

function mostrarCunha(anel, posicao) {
    const abertura = 360 / anel.quantidade;
    const inicio = posicao * abertura - abertura / 2;
    aneis.forEach((outroAnel) => outroAnel.cunha.classList.remove("ativa"));
    anel.cunha.style.background = `conic-gradient(from ${inicio}deg, rgb(255 230 140 / 85%) 0deg ${abertura}deg, transparent ${abertura}deg 360deg)`;
    anel.cunha.classList.add("ativa");
}

function selecionarTecla(tecla, anel, posicao) {
    const indiceAnel = aneis.indexOf(anel);
    if (teclaAtiva === tecla && anelAtualIndice === indiceAnel && posicaoAtualIndice === posicao) return;
    aneis.forEach((outroAnel) => {
        if (outroAnel.cunha) outroAnel.cunha.classList.remove("ativa");
    });
    teclaAtiva = tecla;
    direcaoAtiva = tecla.dataset.direcao;
    anelAtualIndice = indiceAnel;
    posicaoAtualIndice = posicao;
    menuOrbital.classList.add("ativo");
    posicionarMenuOrbital();
    mostrarCunha(anel, posicao);
}

function focarTecla(anelDestino, posicaoDestino) {
    const anel = aneis[anelDestino];
    if (!anel || (anelDestino === 1 && !sugestoesVisiveis) || !anel.teclas.length) return;

    const indiceSeguro = ((posicaoDestino % anel.teclas.length) + anel.teclas.length) % anel.teclas.length;
    aneis.forEach((item) => item.teclas.forEach((tecla) => (tecla.tabIndex = -1)));

    const proximaTecla = anel.teclas[indiceSeguro];
    posicaoAtualIndice = indiceSeguro;
    proximaTecla.tabIndex = 0;
    proximaTecla.focus();
}

// Navegação por seta do teclado físico: um único listener global (ligado
// apenas uma vez, mais abaixo), que usa o cursor (anelAtualIndice/
// posicaoAtualIndice) em vez de depender de qual elemento o navegador
// considera "focado" — assim funciona mesmo quando o foco automático do
// navegador não pega em algum ambiente de exibição. Ele só age quando a
// tela do teclado circular está aberta.
// Cursor extra: quando true, o foco está no botão "Aa" no centro da
// argola de dentro (acessível pela seta para cima a partir dela).
let noBotaoCentral = false;
let teclaRetornoMenu = null;

function tratarSetaTecladoCircular(evento) {
    if (typeof STATE === "undefined" || STATE.screen !== "circularMode") return;
    if (!aneis.length || !aneis[anelAtualIndice]) return;

    const elementoFocado = document.activeElement;
    const anelFocado = aneis.findIndex((anel) => anel.teclas.includes(elementoFocado));
    const focoNaTecla = anelFocado >= 0;
    const botaoCentral = document.querySelector(".botao-alfabeto");
    const focoNoCentro = elementoFocado === botaoCentral;
    const focoNoMenu = botoesMenu.includes(elementoFocado);
    if (!focoNaTecla && !focoNoCentro) {
        if (focoNoMenu) return;
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(evento.key)) {
            evento.preventDefault();
            focarTecla(sugestoesVisiveis ? anelAtualIndice : 0, posicaoAtualIndice);
        }
        return;
    }
    noBotaoCentral = focoNoCentro;

    // Se o foco estiver em um botão do menu lateral, quem cuida disso é o moverNoMenu.
    if (focoNoMenu) return;

    if (noBotaoCentral) {
        if (["Enter", " "].includes(evento.key)) {
            evento.preventDefault();
            noBotaoCentral = false;
            alternarModoAlfabeto();
            return;
        }
        if (evento.key === "ArrowDown" || evento.key === "ArrowUp") {
            evento.preventDefault();
            noBotaoCentral = false;
            focarTecla(anelAtualIndice, posicaoAtualIndice);
        }
        return;
    }

    // Tab pode entrar no menu sem alterar o comportamento circular das setas.
    if (focoNaTecla && evento.key === "Tab" && !evento.shiftKey) {
        evento.preventDefault();
        teclaRetornoMenu = elementoFocado;
        botoesMenu[0]?.focus();
        return;
    }

    if (["Enter", " "].includes(evento.key)) {
        evento.preventDefault();
        selecionarPalavra(aneis[anelAtualIndice].teclas[posicaoAtualIndice]);
        return;
    }

    anelAtualIndice = anelFocado;
    const anelAtual = aneis[anelAtualIndice];
    const indiceFocado = anelAtual.teclas.indexOf(elementoFocado);
    if (indiceFocado >= 0) posicaoAtualIndice = indiceFocado;
    let proximoAnel = anelAtualIndice;
    let proximaPosicao = posicaoAtualIndice;

    switch (evento.key) {
        case "ArrowLeft":
            proximaPosicao = (posicaoAtualIndice + anelAtual.teclas.length - 1) % anelAtual.teclas.length;
            break;
        case "ArrowRight":
            proximaPosicao = (posicaoAtualIndice + 1) % anelAtual.teclas.length;
            break;
        case "ArrowUp":
            if (anelAtualIndice === 1) {
                proximoAnel = 0;
                proximaPosicao = indiceMaisProximoNoAnel(anelAtual, aneis[0], posicaoAtualIndice);
            } else if (anelAtualIndice === 0) {
                evento.preventDefault();
                const botaoCentral = document.querySelector(".botao-alfabeto");
                if (botaoCentral) {
                    evento.preventDefault();
                    noBotaoCentral = true;
                    botaoCentral.focus();
                }
                return;
            }
            break;
        case "ArrowDown":
            if (anelAtualIndice === 0 && sugestoesVisiveis && !modoAlfabeto) {
                proximoAnel = 1;
                proximaPosicao = indiceMaisProximoNoAnel(anelAtual, aneis[1], posicaoAtualIndice);
            }
            break;
        default:
            return;
    }

    if (proximoAnel === 1 && !sugestoesVisiveis) return;

    evento.preventDefault();
    if (proximoAnel !== anelAtualIndice || proximaPosicao !== posicaoAtualIndice) {
        anelAtualIndice = proximoAnel;
        posicaoAtualIndice = proximaPosicao;
        focarTecla(proximoAnel, proximaPosicao);
    }
}

let ckKeydownGlobalBound = false;

function moverNoMenu(evento, indiceAtual) {
    if (evento.key === "Escape") {
        evento.preventDefault();
        const destino = teclaRetornoMenu || aneis[anelAtualIndice]?.teclas?.[posicaoAtualIndice] || teclaAtiva || aneis[0]?.teclas?.[0];
        if (destino) destino.focus();
        teclaRetornoMenu = null;
        return;
    }
}

// Cria (ou recria) as teclas de uma argola com a quantidade indicada,
// substituindo qualquer tecla que já existisse nela. Usada na montagem
// inicial e para reconstruir a argola de dentro no modo alfabético, que
// precisa de mais posições (26) do que as palavras-chave normais (9).
function criarTeclasDoAnel(anel, quantidade, compacta) {
    anel.teclas.forEach((tecla) => tecla.remove());
    anel.teclas = [];
    anel.quantidade = quantidade;

    for (let posicao = 0; posicao < quantidade; posicao += 1) {
        const tecla = document.createElement("button");
        const angulo = (posicao / quantidade) * 360 - 90;
        const x = 50 + Math.cos(angulo * Math.PI / 180) * anel.raio * 0.5;
        const y = 50 + Math.sin(angulo * Math.PI / 180) * anel.raio * 0.5;
        tecla.className = compacta ? "tecla tecla-compacta" : "tecla";
        tecla.type = "button";
        tecla.tabIndex = -1;
        tecla.dataset.direcao = direcaoDoAngulo(angulo);
        tecla.style.left = `${x}%`;
        tecla.style.top = `${y}%`;
        tecla.style.transform = "translate(-50%, -50%)";
        tecla.addEventListener("click", (evento) => {
            evento.stopPropagation();
            selecionarTecla(tecla, anel, posicao);
            selecionarPalavra(tecla);
        });
        tecla.addEventListener("focus", () => {
            if (document.activeElement === tecla) selecionarTecla(tecla, anel, posicao);
        });
        anel.teclas.push(tecla);
        anel.elemento.appendChild(tecla);
    }
}

// Botão "falar": lê em voz alta a frase montada até agora.
function falarFrase() {
    const texto = valor.textContent.trim();
    if (!texto) return;
    if (!("speechSynthesis" in window)) {
        showToast("Este navegador não tem suporte a leitura por voz.");
        return;
    }
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = "pt-BR";
    speechSynthesis.cancel();
    speechSynthesis.speak(fala);
}

function focarInicio() {
    if (aneis[0] && aneis[0].teclas[0]) aneis[0].teclas[0].focus();
}

// Monta (ou remonta) todo o teclado circular na tela "circularMode" atual.
// Chamada pelo render() principal do app sempre que essa tela é exibida,
// já que o app substitui o HTML da tela a cada navegação.
function initCircularKeyboard() {
    valor = document.getElementById("valor");
    menuOrbital = document.getElementById("menuOrbital");
    frasesProntasEl = document.getElementById("frasesProntas");
    if (!valor || !menuOrbital) return;

    botoesMenu = [...menuOrbital.querySelectorAll(".satelite")];

    valor.textContent = "";
    sugestaoSelecionadaBarra = "";
    mostrarFrasesProntas(null);

    teclaAtiva = null;
    direcaoAtiva = "cima";
    sugestoesVisiveis = false;
    anelAtualIndice = 0;
    posicaoAtualIndice = 0;
    modoAlfabeto = false;
    novaPalavraAlfabeto = true;
    noBotaoCentral = false;

    aneis = [
        { elemento: document.getElementById("anelMeio"), quantidade: 9, teclas: [], palavras: palavrasChave, raio: 72, temBuraco: true },
        { elemento: document.getElementById("anelExterno"), quantidade: 10, teclas: [], palavras: [], raio: 80 }
    ];

    aneis.forEach((anel) => {
        const cunha = document.createElement("div");
        cunha.className = "cunha";
        anel.elemento.appendChild(cunha);
        anel.cunha = cunha;

        if (anel.temBuraco) {
            const botaoAlfabeto = document.createElement("button");
            botaoAlfabeto.type = "button";
            botaoAlfabeto.className = "buraco-central botao-alfabeto";
            botaoAlfabeto.textContent = "Aa";
            botaoAlfabeto.setAttribute("aria-label", "Alternar para teclado alfabético");
            botaoAlfabeto.addEventListener("click", alternarModoAlfabeto);
            anel.elemento.appendChild(botaoAlfabeto);
        }

        criarTeclasDoAnel(anel, anel.quantidade, false);
    });

    aneis[0].teclas[0].tabIndex = 0;

    botoesMenu.forEach((botao, indice) => {
        // tabIndex 0 fixo: os botões do menu lateral ficam sempre alcançáveis
        // pela tecla Tab do teclado físico, sem depender de gestos com as setas.
        botao.tabIndex = 0;
        botao.addEventListener("keydown", (evento) => moverNoMenu(evento, indice));
    });

    const btnLimpar = document.getElementById("limpar");
    if (btnLimpar) btnLimpar.addEventListener("click", () => {
        valor.textContent = "";
        voltarConfiguracaoInicial();
    });

    const btnExcluir = document.getElementById("excluir");
    if (btnExcluir) btnExcluir.addEventListener("click", () => {
        const palavras = valor.textContent.trim().split(/\s+/).filter(Boolean);
        palavras.pop();
        valor.textContent = palavras.join(" ");
        if (palavras.length === 0) {
            voltarConfiguracaoInicial();
        } else {
            atualizarSugestoesNoAnel(anelAtualIndice);
            atualizarFrasesProntas();
        }
    });

    const btnRecarregar = document.getElementById("recarregar");
    if (btnRecarregar) btnRecarregar.addEventListener("click", () => recarregarSugestoes());

    const btnVoltarInicio = document.getElementById("voltarInicio");
    if (btnVoltarInicio) btnVoltarInicio.addEventListener("click", () => voltarConfiguracaoInicial());

    const btnFalar = document.getElementById("falar");
    if (btnFalar) btnFalar.addEventListener("click", falarFrase);

    // Botão "concluir": corrige a ortografia/gramática da frase com o
    // LanguageTool, mostra o texto corrigido e devolve o teclado à
    // configuração inicial (argola de dentro com as palavras-chave de novo).
    const btnConcluir = document.getElementById("concluir");
    if (btnConcluir) btnConcluir.addEventListener("click", async () => {
        const textoOriginal = valor.textContent.trim();
        const textoComNomesSalvos = canonicalizarNomesPersonalizados(textoOriginal);
        const textoCorrigido = await corrigirComGemini(textoComNomesSalvos) || await corrigirComLanguageTool(textoComNomesSalvos);
        valor.textContent = textoCorrigido;
        voltarConfiguracaoInicial();
    });

    atualizarAnelPalavrasChave();
    atualizarFrasesProntas();
    posicionarMenuOrbital();

    if (!ckKeydownGlobalBound) {
        ckKeydownGlobalBound = true;
        document.addEventListener("keydown", tratarSetaTecladoCircular);
    }

    // Pré-seleciona a primeira palavra ao abrir e confirma o foco depois que a
    // renderização da tela termina, sem roubar o foco de uma tecla já escolhida.
    focarInicio();
    requestAnimationFrame(() => {
        const focoNaArgolaInicial = aneis[0]?.teclas.includes(document.activeElement);
        const focoNoCentro = document.activeElement === document.querySelector(".botao-alfabeto");
        const focoNoMenu = botoesMenu.includes(document.activeElement);
        if (STATE.screen === "circularMode" && !sugestoesVisiveis && !focoNaArgolaInicial && !focoNoCentro && !focoNoMenu) {
            focarInicio();
        }
    });
}

loadData();
initSplash();
initGamepadControls();
</script>
<script>
/* Aba "Ativar/Desativar controle ocular" (criada pelo ocular-tracking.js):
   localizada pelo texto e pintada com o mesmo azul dos botões do app.
   Os estilos são aplicados direto no elemento (inline + !important) para
   vencer qualquer estilo definido pelo próprio ocular-tracking.js. */
(function () {
  const TRECHO = 'controle ocular';
  let agendado = false;
  let aplicando = false;

  function cores(estado) {
    const escuro = document.body.dataset.theme !== 'light';
    if (estado === 'destaque') return { bg: '#fff2bf', cor: '#173a5e', borda: '#f3d675' };
    return escuro
      ? { bg: '#1b344d', cor: '#f1f7ff', borda: '#3d6688' }
      : { bg: 'rgba(234, 246, 255, 0.95)', cor: '#173a5e', borda: '#cfe9f7' };
  }

  function estilizar(el, estado) {
    const c = cores(estado);
    const set = (prop, valor) => {
      if (el.style.getPropertyValue(prop) !== valor || el.style.getPropertyPriority(prop) !== 'important') {
        el.style.setProperty(prop, valor, 'important');
      }
    };
    set('background', c.bg);
    set('background-image', 'none');
    set('color', c.cor);
    set('border', '1.5px solid ' + c.borda);
    set('border-radius', '16px');
    set('box-shadow', '0 3px 8px rgba(23, 58, 94, 0.12)');
    set('font-family', "'Baloo 2', cursive");
    set('font-weight', '800');
    set('font-size', '14px');
    set('line-height', '1.2');
    set('padding', '10px 16px');
    set('text-shadow', 'none');
    set('opacity', '1');
    el.querySelectorAll('*').forEach(filho => {
      if (filho.style.getPropertyValue('color') !== c.cor) filho.style.setProperty('color', c.cor, 'important');
      if (filho.style.getPropertyValue('text-shadow') !== 'none') filho.style.setProperty('text-shadow', 'none', 'important');
    });
  }

  function ehAbaOcular(el) {
    const texto = (el.textContent || '').toLowerCase();
    const rotulo = ((el.getAttribute && (el.getAttribute('aria-label') || el.getAttribute('title'))) || '').toLowerCase();
    return (texto.length < 60 && texto.includes(TRECHO)) || rotulo.includes(TRECHO);
  }

  function marcarAbaOcular() {
    agendado = false;
    aplicando = true;
    const candidatos = [...document.querySelectorAll('button, [role="button"], a, div, span, label')]
      .filter(el => !el.closest('#app') && ehAbaOcular(el));
    const abas = candidatos
      .filter(el => !candidatos.some(outro => outro !== el && el.contains(outro)))
      .map(el => el.closest('button, [role="button"], a') || el);
    abas.forEach(alvo => {
      alvo.classList.add('ocular-tab-oculta');
      alvo.style.setProperty('display', 'none', 'important');
    });
    window.__abaOcular = abas[0] || null;
    sincronizarBotaoOcular();
    aplicando = false;
  }

  function sincronizarBotaoOcular() {
    const btn = document.getElementById('ocularSettingsBtn');
    if (!btn) return;
    const aba = window.__abaOcular;
    const texto = aba ? (aba.textContent || '').toLowerCase() : '';
    const ligado = texto.includes('desativar');
    btn.disabled = !aba;
    btn.textContent = !aba ? 'Indisponível' : (ligado ? 'Desativar' : 'Ativar');
    btn.setAttribute('aria-label', !aba ? 'Controle ocular indisponível' : (ligado ? 'Desativar controle ocular' : 'Ativar controle ocular'));
    btn.classList.toggle('ligado', ligado);
  }

  document.addEventListener('click', ev => {
    const btn = ev.target.closest && ev.target.closest('#ocularSettingsBtn');
    if (!btn || !window.__abaOcular) return;
    window.__abaOcular.click();
    setTimeout(agendar, 150);
    setTimeout(agendar, 800);
  });

  function agendar() {
    if (agendado || aplicando) return;
    agendado = true;
    requestAnimationFrame(marcarAbaOcular);
  }

  new MutationObserver(agendar).observe(document.documentElement, {
    childList: true, subtree: true, characterData: true,
    attributes: true, attributeFilter: ['style', 'class', 'data-theme']
  });
  window.addEventListener('load', agendar);
  setInterval(agendar, 1500);
  agendar();
})();
</script>
